/* =====================================================================
   BEREICH A und B: HILFE TEIL 1 und TEIL 2
   Ablauf eines Teils:
   1. Eintragen: das ganze Schema ausfüllen und prüfen.
   2. Rückfragen zu den Einträgen, die beim ersten Prüfen schon stimmen.
   3. Hilfe zu den anderen Einträgen, ein Schritt nach dem anderen. Die Hilfe zu einem
      Schritt (S1 bis S8) erscheint nur bei Bedarf, ist auf die Antworten der Gruppe
      zugeschnitten und baut auf ihren richtigen Einträgen auf.
   4. Zum Schluss Rückfragen zu korrigierten Einträgen, danach die Profi-Aufgaben.
   ===================================================================== */
const bereiche = {
  teil1: $('#bereich-teil1'), teil2: $('#bereich-teil2'),
  quiz: $('#bereich-quiz'), lehrkraft: $('#bereich-lehrkraft')
};

function hilfeText(teil) {
  const n = zustand.hilfen[teil];
  if (n === 0) return A.hilfeZaehlerKeine;
  if (n === 1) return A.hilfeZaehlerEins;
  return fmt(A.hilfeZaehlerViele, { n: n });
}

/* ----- Wo steht die Gruppe gerade? ----- */
// Schritte eines Teils, deren Felder alle im Schema geprüft werden
function einheiten(teil) {
  const felder = CONTENT[teil].pruefen.felder;
  return CONTENT[teil].schritte.filter(function (def) { return def.felder.every(function (id) { return felder.indexOf(id) >= 0; }); });
}
function feldStimmt(teil, id) { return zustand.pruefung[teil].ergebnis[id] === 'ok'; }
function einheitStimmt(teil, def) { return def.felder.every(function (id) { return feldStimmt(teil, id); }); }
function einheitErstRichtig(teil, def) {
  const e = zustand.pruefung[teil].erste;
  return !!e && def.felder.every(function (id) { return e[id] === 'ok'; });
}
// Schritte mit Hilfe: alle, die beim ersten Prüfen nicht ganz richtig waren
function hilfeEinheiten(teil) { return einheiten(teil).filter(function (def) { return !einheitErstRichtig(teil, def); }); }
function alleFelderStimmen(teil) { return CONTENT[teil].pruefen.felder.every(function (id) { return feldStimmt(teil, id); }); }

/* ----- Schrittweise aufdecken -----
   Nach dem Prüfen sieht die Gruppe nur, wie viele Einträge stimmen, nicht welche.
   Ein richtiger Eintrag wird erst grün, wenn die Rückfrage dazu gelöst ist oder er in der Hilfe korrigiert wurde.
   Welcher Eintrag im Schritt mit Hilfe falsch ist, zeigt sich erst beim Teilergebnis,
   außer es ist ohnehin klar, weil alle anderen Einträge des Schritts schon bestätigt sind. */
function einheitVon(teil, id) { return einheiten(teil).find(function (d) { return d.felder.indexOf(id) >= 0; }); }
// Bewertung beim letzten Prüfen (ändert sich nicht, solange die Gruppe nur Felder umstellt)
function letzteBewertung(teil, id) { return feldBewertung(id, zustand.pruefung[teil].geprueft[id]); }
function feldBestaetigt(teil, id) {
  const pz = zustand.pruefung[teil];
  if (!pz.erste || !feldStimmt(teil, id)) return false;
  if (alleFelderStimmen(teil)) return true;
  const def = einheitVon(teil, id);
  const geloest = function (k) { return !!pz.rf[k] && pz.rf[k].geloest; };
  if (geloest(id) || (def && geloest(def.id))) return true;
  // In der Hilfe richtig korrigiert oder Schritt mit Hilfe ganz geschafft
  return !!def && hilfeEinheiten(teil).indexOf(def) >= 0 && (pz.erste[id] !== 'ok' || einheitStimmt(teil, def));
}
// Ist ohnehin klar, welche Einträge des Schritts falsch sind? Ja, wenn alle anderen bestätigt sind.
function falscheErkennbar(teil, def) {
  return def.felder.every(function (id) { return letzteBewertung(teil, id) !== 'ok' || feldBestaetigt(teil, id); });
}
function falscheFelder(teil, def) { return def.felder.filter(function (id) { return letzteBewertung(teil, id) !== 'ok'; }); }
function falscheZeigen(teil, def) { return sz(def.id).stufe >= 3 || falscheErkennbar(teil, def); }
// Was die Gruppe von der Bewertung eines Feldes sieht: 'ok', 'nein', 'fast' oder '' (noch verdeckt)
function sichtbareBewertung(teil, id) {
  const pz = zustand.pruefung[teil];
  const erg = pz.ergebnis[id];
  if (!pz.erste || !erg) return '';
  if (erg === 'ok') return feldBestaetigt(teil, id) ? 'ok' : '';
  const st = ablaufStand(teil);
  if (st.phase !== 'hilfe' || st.def.felder.indexOf(id) < 0) return '';
  return falscheZeigen(teil, st.def) ? erg : '';
}
function sichtbaresErgebnis(teil) {
  const e = {};
  CONTENT[teil].pruefen.felder.forEach(function (id) { const b = sichtbareBewertung(teil, id); if (b) e[id] = b; });
  return e;
}

// Ergebnis: phase 'eintragen', 'rueckfragen' (etappe 'A' am Anfang, 'C' am Ende), 'hilfe' (def = Schritt) oder 'fertig'
function ablaufStand(teil) {
  const pz = zustand.pruefung[teil];
  if (!pz.erste) return { phase: 'eintragen' };
  if (pz.bestanden) return { phase: 'fertig' };
  if (pz.rfListe.some(function (k) { return !rfZustand(teil, k).geloest; })) return { phase: 'rueckfragen', etappe: 'A' };
  const falsch = einheiten(teil).find(function (def) { return !einheitStimmt(teil, def); });
  if (falsch) return { phase: 'hilfe', def: falsch };
  if (pz.rf2Liste.some(function (k) { return !rfZustand(teil, k).geloest; })) return { phase: 'rueckfragen', etappe: 'C' };
  return { phase: 'fertig' };
}

/* ----- Rückfragen (Schlüssel = Schritt, zum Beispiel 'S1', oder einzelnes Feld, zum Beispiel 'pol-luft') ----- */
function rfDef(teil, key) { return CONTENT[teil].pruefen.rueckfragen[key]; }
function rfZustand(teil, key) {
  const pz = zustand.pruefung[teil];
  if (!pz.rf[key]) pz.rf[key] = { wahl: [], versucht: [], letzte: null, falsch: false, geloest: false, fehl: 0, sperreVon: 0, sperreBis: 0 };
  return pz.rf[key];
}
// Darf die Rückfrage schon jetzt kommen, ohne etwas über einen falschen Eintrag zu verraten?
function rfFrei(teil, key) {
  const R = rfDef(teil, key);
  return !!R && (R.nach || []).every(function (id) { return einheitErstRichtig(teil, schrittDef(id)); });
}
// Gleich nach dem ersten Prüfen: Rückfragen zu Schritten, die ganz richtig sind,
// und zu einzelnen richtigen Feldern, wenn im selben Schritt etwas noch nicht stimmt
function rueckfragenZuerst(teil) {
  const e = zustand.pruefung[teil].erste;
  const liste = [];
  einheiten(teil).forEach(function (def) {
    const richtig = def.felder.filter(function (id) { return e[id] === 'ok'; });
    const keys = richtig.length === def.felder.length ? [def.id] : richtig.filter(function (id) { return !!rfDef(teil, id); });
    keys.forEach(function (k) { if (rfFrei(teil, k)) liste.push(k); });
  });
  return liste;
}
// Wenn alles stimmt: Rückfragen, die vorher etwas verraten hätten,
// und zu korrigierten Schritten, deren Fragen zum Weiterdenken nicht alle gelöst sind
function rueckfragenZumSchluss(teil) {
  const pz = zustand.pruefung[teil];
  return einheiten(teil).filter(function (def) {
    if (!rfDef(teil, def.id) || pz.rfListe.indexOf(def.id) >= 0) return false;
    return einheitErstRichtig(teil, def) || !fragenGeloest(def);
  }).map(function (def) { return def.id; });
}
function offeneRueckfragen(teil) {
  const pz = zustand.pruefung[teil];
  return pz.rfListe.concat(pz.rf2Liste).filter(function (k) { return !rfZustand(teil, k).geloest; });
}
// Alles geschafft? Dann sind die Profi-Aufgaben frei.
function bestandenPruefen(teil) {
  const pz = zustand.pruefung[teil];
  if (!pz.bestanden && pz.erste && alleFelderStimmen(teil) && !offeneRueckfragen(teil).length) pz.bestanden = true;

    h += '<div class="stufe"><span class="stufe-label">' + esc(ST.stufe2Label) + '</span>';
    z.fragen.forEach(function (fz, i) { h += htmlHilfeFrage(def, z, i, fz); });
    const letzte = z.fragen[z.fragen.length - 1];
    if (letzte && letzte.geloest && z.fragen.length < z.auswahl.length) {
      const bis = letzte.gezeigt + zeit('T_ZWISCHEN_FRAGEN');
      if (jetzt() < bis) h += '<p class="hinweis-leise">' + esc(ST.naechsteFrageWarten) + '</p>' + knopfWarten(ST.naechsteFrage, letzte.gezeigt, bis, 'teil', null, 'knopf-zweit');
      else h += '<button type="button" class="knopf" data-aktion="naechste-frage" data-schritt="' + def.id + '">' + esc(ST.naechsteFrage) + '</button>';
    }
    if (fragenGeloest(def) && z.stufe === 2) h += '<div class="rueckmeldung stimmt">' + esc(ST.alleFragenGeloest) + '</div>';
    h += '</div>';
    if (z.stufe === 2) {
      const bis = z.t2 + zeit('T_STUFE3');
      const frei = stufe3Frei(def, z);
      h += '<div class="stufe"><button type="button" class="knopf" data-aktion="stufe3" data-schritt="' + def.id + '"' + (frei ? '' : ' disabled') + '>' + esc(ST.stufe3Knopf) + '</button>';
      if (!frei) h += '<p class="tor-hinweis">' + esc(ST.stufe3WartenFragen) + '</p>' + htmlCountdown(z.t2, bis, 'teil', ST.stufe3WartenZeit);
      h += '</div>';
    }
  }
  if (z.stufe >= 3) h += htmlVergleich(teil, def);
  return h;
}

function quizFrage(id) { return CONTENT.quiz.fragen.find(function (f) { return f.id === id; }); }

function quizStarten(modus) {
  const Q = CONTENT.quiz;
  const nach = function (n) { return Q.fragen.filter(function (f) { return f.niveau === n; }); };
  let liste;
  if (modus === 'gemischt') {
    const m = CONFIG.QUIZ_MISCHUNG;
    // Basis-Fragen zuerst, dann Standard, dann Profi
    liste = mischen(nach('basis')).slice(0, m.basis)
      .concat(mischen(nach('standard')).slice(0, m.standard))
      .concat(mischen(nach('profi')).slice(0, m.profi));
  } else {
    liste = mischen(nach(modus)).slice(0, CONFIG.QUIZ_FRAGEN_PRO_RUNDE);
  }
  zustand.quiz.runde = { modus: modus, folge: liste.map(function (f) { return f.id; }), anzahl: liste.length, pos: 0, ergebnisse: {}, versuche: {} };
  zustand.quiz.ansicht = 'runde';
  ui.quiz = null;
  speichern();
}

// Antwort auf die aktuelle Frage (nur im Speicher der Seite).
// versuch 1 oder 2: Nach einem Fehler gibt es zuerst einen Tipp, danach einen zweiten Versuch.
function quizAntwort(r, f) {
  if (!ui.quiz || ui.quiz.pos !== r.pos || ui.quiz.id !== f.id) {
    ui.quiz = { pos: r.pos, id: f.id, wahl: null, rf: null, begr: null, gewaehlt: null, paare: {}, luecken: {}, geprueft: false, korrekt: false,
      folge: null, begrFolge: null, versuch: 1, hinweis: null, sperreVon: 0, sperreBis: 0, versucht: [], fest: {}, ersterOk: null };
    if (f.typ === 'auswahl') ui.quiz.folge = mischen(f.optionen.map(function (o, i) { return i; }));
    if (f.typ === 'richtigfalsch') ui.quiz.begrFolge = mischen(f.begruendungen.map(function (o, i) { return i; }));
  }
  return ui.quiz;
}
function quizGesperrt(a) { return !a.geprueft && a.sperreBis > jetzt(); }

function quizVollstaendig(f, a) {
  if (f.typ === 'auswahl') return a.wahl !== null;
  if (f.typ === 'richtigfalsch') return a.rf !== null && a.begr !== null;
  if (f.typ === 'zuordnen') return Object.keys(a.paare).length === f.begriffe.length;
  if (f.typ === 'luecken') return f.luecken.every(function (w, i) { return !!a.luecken[i]; });
  return false;
}
function quizRichtig(f, a) {
  if (f.typ === 'auswahl') return a.wahl === f.richtig;
  if (f.typ === 'richtigfalsch') return a.rf === f.richtig && a.begr === f.begruendungRichtig;
  if (f.typ === 'zuordnen') return f.begriffe.every(function (b, i) { return a.paare[f.loesung[i]] === i; });
  if (f.typ === 'luecken') return f.luecken.every(function (w, i) { return a.luecken[i] === w; });
  return false;
}

// Antwortknopf im Quiz; inhalt ist fertiges HTML. aus = gesperrt, versucht = im ersten Versuch falsch gewählt
function htmlOptionQuiz(aktion, wert, inhalt, an, geprueft, istRichtig, aus, versucht) {
  let cls = 'option';
  let zusatz = '';
  if (geprueft) {
    if (istRichtig) { cls += ' richtig-markiert'; zusatz = an ? '' : ' <span class="option-zusatz">(' + esc(CONTENT.quiz.richtigeAntwort) + ')</span>'; }
    else if (an) { cls += ' daneben'; zusatz = ' <span class="option-zusatz">(' + esc(CONTENT.quiz.deineWahl) + ')</span>'; }
  } else if (versucht) {
    cls += ' versucht'; zusatz = ' <span class="option-zusatz">(' + esc(CONTENT.quiz.schonVersucht) + ')</span>';
  } else if (an) cls += ' gewaehlt';
  return '<button type="button" class="' + cls + '" data-aktion="' + aktion + '" data-wert="' + wert + '" aria-pressed="' + an + '"' + ((geprueft || aus || versucht) ? ' disabled' : '') + '>' +
    ((geprueft && istRichtig) ? '✓ ' : '') + inhalt + zusatz + '</button>';
}
function quizOptionInhalt(o) {
  if (o && typeof o === 'object') return '<span class="option-bild">' + bildSvg(o.bild) + '<span>' + esc(o.text) + '</span></span>';
  return esc(o);
}

function htmlQuizZuordnen(f, a) {
  const Q = CONTENT.quiz;

  else if (f.typ === 'luecken') h += htmlQuizLuecken(f, a);
  if (!a.geprueft) {
    // Nach dem ersten Fehler: erst der Tipp, dann (nach der Sperrzeit) der zweite Versuch
    if (a.versuch === 2) {
      h += '<div class="rueckmeldung rueckfrage quiz-tipp" role="status"><strong>' + esc(Q.nochEinmal) + '</strong>' +
        (a.hinweis ? '<br>' + esc(a.hinweis) : '') + '<br><strong>' + esc(Q.tippLabel) + '</strong> ' + esc(f.tipp) + '</div>';
      if (quizGesperrt(a)) h += htmlCountdown(a.sperreVon, a.sperreBis, 'quiz', Q.sperre);
    }
    h += '<div class="knopf-reihe"><button type="button" class="knopf knopf-primaer" data-aktion="quiz-pruefen" id="quiz-pruefen"' + ((quizVollstaendig(f, a) && !quizGesperrt(a)) ? '' : ' disabled') + '>' + esc(Q.pruefen) + '</button></div>';
  } else {
    const titel = a.korrekt ? (a.versuch === 2 ? Q.richtigMitTipp : Q.richtig) : Q.falsch;
    h += '<div class="rueckmeldung ' + (a.korrekt ? 'stimmt' : 'rueckfrage') + '" role="status"><strong>' + esc(titel) + '</strong></div>' +

      '<div class="knopf-reihe"><button type="button" class="knopf knopf-primaer" data-aktion="quiz-weiter" id="quiz-weiter">' + esc(Q.weiter) + '</button></div>';
  }

  return h + '</div>';
}

// Kurze Rückmeldung, welcher Teil der Antwort noch nicht stimmt (ohne die Lösung zu nennen)
function quizTeilHinweis(f, a) {
  const Q = CONTENT.quiz;
  if (f.typ === 'richtigfalsch') {
    const urteil = a.rf === f.richtig, begr = a.begr === f.begruendungRichtig;
    return (!urteil && !begr) ? Q.teilBeide : (!urteil ? Q.teilUrteil : Q.teilBegruendung);
  }
  if (f.typ === 'zuordnen') return Q.teilZuordnen;
  if (f.typ === 'luecken') return Q.teilLuecken;
  return null;
}
// Falsche Teile zurücksetzen, richtige stehen lassen
function quizFalschesZuruecksetzen(f, a) {
  if (f.typ === 'auswahl') { a.versucht.push(a.wahl); a.wahl = null; }
  else if (f.typ === 'richtigfalsch') {
    if (a.rf !== f.richtig) a.rf = null;
    if (a.begr !== f.begruendungRichtig) a.begr = null;
  } else if (f.typ === 'zuordnen') {
    Object.keys(a.paare).forEach(function (ziel) {
      if (f.loesung[a.paare[ziel]] === ziel) a.fest[ziel] = true; else delete a.paare[ziel];
    });
    a.gewaehlt = null;
  } else if (f.typ === 'luecken') {
    f.luecken.forEach(function (w, i) { if (a.luecken[i] === w) a.fest[i] = true; else a.luecken[i] = ''; });
  }
}

function quizPruefen() {
  const r = zustand.quiz.runde;
  const f = quizFrage(r.folge[r.pos]);
  const a = quizAntwort(r, f);
  if (a.geprueft || quizGesperrt(a) || !quizVollstaendig(f, a)) return;
  const ok = quizRichtig(f, a);
  if (!(f.id in r.ergebnisse)) r.ergebnisse[f.id] = ok;   // für das Ergebnis zählt nur der allererste Versuch
  if (a.ersterOk === null) a.ersterOk = ok;
  if (!ok && a.versuch === 1) {
    // Erst helfen: Tipp zeigen, falsche Teile zurücksetzen, kurze Sperre, dann zweiter Versuch
    a.versuch = 2;
    a.hinweis = quizTeilHinweis(f, a);
    quizFalschesZuruecksetzen(f, a);
    a.sperreVon = jetzt();
    a.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
    speichern();
    return;
  }
  a.geprueft = true;
  a.korrekt = ok;
  r.versuche[f.id] = (r.versuche[f.id] || 0) + 1;
  // Fragen, die nicht im ersten Versuch richtig waren, kommen am Ende der Runde noch einmal
  if (!a.ersterOk && r.versuche[f.id] <= CONFIG.QUIZ_MAX_WIEDERHOLUNGEN) r.folge.push(f.id);
  speichern();
}

/* =====================================================================
   STATUSZEILE UND GESAMTANSICHT
   ===================================================================== */
function zeichneStatus() {
  const S = A.status;
  const tab = zustand.tab;
  let t = '';
  if (tab === 'teil1' || tab === 'teil2') {
    const nr = tab === 'teil1' ? 1 : 2;
    if (tab === 'teil2' && !zustand.teil2Frei) {
      t = S.teil + ' 2 · ' + S.gesperrt;
    } else {
      const n = zustand.hilfen[tab];
      const hilfen = n + ' ' + (n === 1 ? S.hilfe : S.hilfen);
      const st = ablaufStand(tab);
      t = S.teil + ' ' + nr + ' · ';
      if (st.phase === 'eintragen') t += S.eintragen;
      else if (st.phase === 'rueckfragen') t += S.rueckfragen;
      else if (st.phase === 'hilfe') t += S.hilfeZu + ' ' + (st.def.nr || st.def.kurz) + ' · ' + S.stufe + ' ' + sz(st.def.id).stufe;
      else t += S.geprueft;
      t += ' · ' + hilfen;
    }
  } else if (tab === 'quiz') {
    const qz = zustand.quiz;
    if (zustand.quizOffen && qz.ansicht === 'runde' && qz.runde && qz.runde.pos < qz.runde.folge.length) t = S.quiz + ' · ' + S.frage + ' ' + (qz.runde.pos + 1) + ' ' + S.von + ' ' + qz.runde.folge.length;
    else if (zustand.quizOffen && qz.ansicht === 'ende') t = S.quiz + ' · ' + S.ende;
    else if (zustand.quizOffen && qz.ansicht === 'abfrage') t = S.quiz + ' · ' + S.abfrage;
    else t = S.quiz + ' · ' + S.start;
  } else {
    t = S.lehrkraft;
  }
  $('#statuszeile').textContent = t;
}

function zeichneBereich() {
  const t = zustand.tab;
  if (t === 'teil1' || t === 'teil2') zeichneTeil(t);
  else if (t === 'quiz') zeichneQuiz();
  else zeichneLehrkraft();
}
function allesZeichnen() {
  ['teil1', 'teil2', 'quiz', 'lehrkraft'].forEach(function (t) {
    const aktiv = zustand.tab === t;
    const knopf = $('#tab-' + t);
    knopf.classList.toggle('aktiv', aktiv);
    // Teil 1, Teil 2, Quiz sind Tabs in der Leiste unten; der Lehrkraft-Bereich ist ein Knopf oben
    knopf.setAttribute(t === 'lehrkraft' ? 'aria-pressed' : 'aria-selected', aktiv ? 'true' : 'false');
    bereiche[t].hidden = !aktiv;
    if (!aktiv) bereiche[t].innerHTML = '';   // Spoilerschutz: unsichtbare Bereiche bleiben leer
  });
  // Farbe je Bereich (Teil 2 in Petrol) und Schloss am Tab, solange Teil 2 gesperrt ist
  document.documentElement.setAttribute('data-bereich', zustand.tab);
  $('#tab-schloss').hidden = !!zustand.teil2Frei;
  zeichneBereich();
  kartenNachBedarf();
}

/* ----- Fokus beim Neuzeichnen erhalten (Tastaturbedienung) ----- */
let fokusMerker = null;
function merkeFokus() {
  const e = document.activeElement;
  if (!e || e === document.body || !e.dataset) { fokusMerker = null; return; }
  fokusMerker = { id: e.id || '', daten: JSON.stringify(e.dataset) };
}
function stelleFokusHer() {
  if (!fokusMerker) return;
  let e = fokusMerker.id ? document.getElementById(fokusMerker.id) : null;
  if (!e) e = $$('[data-aktion],[data-eingabe]').find(function (x) { return JSON.stringify(x.dataset) === fokusMerker.daten; });
  if (e && !e.disabled) { try { e.focus({ preventScroll: true }); } catch (err) { /* ältere Browser */ } }
  fokusMerker = null;
}
function neu(fn) { merkeFokus(); fn(); stelleFokusHer(); }
function ersetzeBlock(sel, html) {
  const alt = $(sel);
  if (!alt) return false;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  if (tmp.firstElementChild) alt.parentNode.replaceChild(tmp.firstElementChild, alt);
  return true;
}
function blockNeu(block) {
  const tab = zustand.tab;
  neu(function () {
    if (block === 'teil' && (tab === 'teil1' || tab === 'teil2')) zeichneTeil(tab);
    else if (block === 'p1') ersetzeBlock('#block-p1', htmlP1());
    else if (block === 'p3') ersetzeBlock('#block-p3', htmlP3());
    else if (block === 'p4') ersetzeBlock('#block-p4wahl', htmlP4Wahl());
    else zeichneBereich();
  });
}
// Bereich, in dem ein Feld liegt, neu zeichnen
function gruppeNeu(gruppe) {
  if (gruppe === 'p1') blockNeu('p1');
  else blockNeu('teil');
}

/* ----- Takt für alle Countdowns (viermal pro Sekunde) ----- */
function takt() {
  const t = jetzt();
  const fertig = {};
  $$('[data-bis]').forEach(function (el) {
    const bis = +el.dataset.bis, von = +el.dataset.von;
    const rest = bis - t;
    if (rest <= 0) { fertig[el.dataset.block] = true; return; }
    const text = el.querySelector('.countdown-text');
    if (text) text.textContent = fmt(el.dataset.vorlage, { zeit: mmss(rest) });
    const balken = el.querySelector('.countdown-balken > span');
    if (balken && bis > von) balken.style.width = Math.min(100, 100 * (t - von) / (bis - von)).toFixed(1) + '%';
  });
  Object.keys(fertig).forEach(blockNeu);
}

/* =====================================================================
   AKTIONEN (was beim Antippen passiert)
   ===================================================================== */
function nachOben(sel) {
  const el = $(sel);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function teilNeu() {
  neu(function () { zeichneTeil(zustand.tab); });
  // Nach dem Prüfen oder einer gelösten Rückfrage: den nächsten Abschnitt zeigen und vorlesen lassen
  if (ui.zumAblauf === zustand.tab) {
    ui.zumAblauf = null;
    const titel = $('#bereich-' + zustand.tab + ' .ablauf-titel') || $('#bereich-' + zustand.tab + ' .profi-titel');
    if (titel) {
      titel.scrollIntoView({ block: 'start', behavior: bewegungErlaubt() ? 'smooth' : 'auto' });
      if (titel.hasAttribute('tabindex')) { try { titel.focus({ preventScroll: true }); } catch (e) { /* ältere Browser */ } }
    }
  }
  kartenNachBedarf();
}
// Neue Karten der Stunde, sobald sie in Teil 1 gebraucht werden: W8 (Hoch und Tief) bei S1, W9 (vom Hoch zum Tief) bei S2
const KARTEN_BEDARF = { S1: ['W8'], S2: ['W9'], S3: ['W9'], S4: ['W8', 'W9'], HOEHE: ['W8', 'W9'] };
function kartenNachBedarf() {
  if (zustand.tab !== 'teil1') return;
  const st = ablaufStand('teil1');
  let schritt = null;
  if (st.phase === 'hilfe') schritt = st.def.id;
  else if (st.phase === 'rueckfragen') {
    const key = offeneRueckfragen('teil1')[0];
    if (key) schritt = schrittDef(key) ? key : (einheitVon('teil1', key) || {}).id;
  } else if (st.phase === 'fertig') schritt = 'HOEHE';
  if (schritt && KARTEN_BEDARF[schritt]) karteFreischalten(KARTEN_BEDARF[schritt]);
}
function bewegungErlaubt() { return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

function teil2Freischalten() {
  const neuFrei = !zustand.teil2Frei;
  zustand.teil2Frei = true;
  speichern();
  karteFreischalten(['W8', 'W9', 'W10'], true);   // Teil 1 ist dann schon gesichert
  karteFreischalten(['W11', 'W12']);
  return neuFrei;
}
// Wert eines Feldes setzen (aus Antippen, Auswahlknopf oder Richtungsauswahl)
function feldSetzen(gruppe, id, wert) {
  if (!feldOffen(gruppe, id)) return;
  gruppeWerte(gruppe)[id] = wert;
  delete gruppeErgebnis(gruppe)[id];   // geänderter Eintrag ist noch nicht geprüft
  ui.hinweis[gruppe] = '';
  speichern();
  gruppeNeu(gruppe);
}
function htmlRichtungsauswahl(gruppe, id) {
  return '<p class="einleitung">' + esc(feldDef(id).text) + '</p>' + htmlKompassFeld(gruppe, id, gruppeWerte(gruppe)[id], false);
}
function oeffneRichtungsauswahl(gruppe, id) {
  oeffneModal(CONTENT.teil2.werte.auswahlTitel, htmlRichtungsauswahl(gruppe, id), CONTENT.teil2.werte.aus.fertig);
  $('#modal-zu').className = 'knopf knopf-primaer';
}

/* ----- Schema von Teil 1 oder 2 prüfen ----- */
function schemaPruefen(teil) {
  const pz = zustand.pruefung[teil];
  const P = CONTENT[teil].pruefen;
  const st = ablaufStand(teil);
  if ((st.phase !== 'eintragen' && st.phase !== 'hilfe') || pz.sperreBis > jetzt()) return;
  if (P.felder.some(function (id) { return !pz.werte[id]; })) { ui.hinweis[teil] = P.unvollstaendig; teilNeu(); return; }
  ui.hinweis[teil] = '';
  P.felder.forEach(function (id) {
    const erg = feldBewertung(id, pz.werte[id]);
    pz.ergebnis[id] = erg;
    if (erg !== 'ok') pz.fehl[id] = (pz.fehl[id] || 0) + 1;
  });
  pz.geprueft = Object.assign({}, pz.werte);
  if (!pz.erste) {
    // Erstes Prüfen: Diese Antworten bestimmen den weiteren Weg
    pz.erste = Object.assign({}, pz.ergebnis);
    pz.ersteWerte = Object.assign({}, pz.werte);
    pz.rfListe = rueckfragenZuerst(teil);
  } else if (st.phase === 'hilfe' && !einheitStimmt(teil, st.def)) {
    // Der Schritt mit Hilfe stimmt noch nicht: kurze Sperre, dann neuer Versuch
    pz.sperreVon = jetzt();
    pz.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
    zeigeMeldung(ST.meldungNochNicht);
  } else if (st.phase === 'hilfe') {
    zeigeMeldung(fmt(ST.meldungStimmt, { kurz: st.def.kurz }));
  }
  einheiten(teil).forEach(function (def) { if (einheitStimmt(teil, def)) sz(def.id).erledigt = true; });
  if (alleFelderStimmen(teil)) {
    pz.rf2Liste = rueckfragenZumSchluss(teil);
    bestandenPruefen(teil);
  }
  speichern();
  ui.zumAblauf = teil;
  teilNeu();
  // Nach S4 (alle Felder dort richtig) gibt es die neue Werkzeugkarte W10
  if (teil === 'teil1' && einheitStimmt('teil1', schrittDef('S4'))) karteFreischalten(['W10']);
}

const AKTIONEN = {

    const anderer = zustand.tab !== d.tab;

  'baukasten-zu': function () { schliesseBaukasten(); },
  // Schriftgröße: normal, groß, sehr groß (gilt auf diesem Gerät)
  'schrift': function (d) {

  'karte': function (d) { zeigeBaukasten(d.karte); },
  'glossar': function (d) { oeffneModal(d.begriff, '<p>' + esc(CONTENT.glossar[d.begriff] || '') + '</p>'); },
  'satzbausteine': function (d) { zeigeSatzbausteine(d.set); },
  'modal-zu': function () { schliesseModal(); },
  'karten-zu': function () {
    const ov = $('#karten-overlay');
    ov.hidden = true; ov.innerHTML = '';
    ui.neueKarten = [];
    // Nach der neuen Karte (W10) das Teilergebnis abspielen, das unter dem Fenster lag
    if (ui.animNachKarte) { vergleichAbspielen(ui.animNachKarte); ui.animNachKarte = null; }
  },

  // Helle oder dunkle Ansicht (Schalter oben rechts, gilt auf diesem Gerät)
  'dunkel': function () {
    zustand.einstellungen.dunkel = !istDunkel();
    speichern();
    ansichtAnwenden();
  },
  // Felder in Skizzen: Antippen schaltet weiter, bei Himmelsrichtungen öffnet sich die Auswahl
  'feld': function (d) {
    if (!feldOffen(d.gruppe, d.feld)) return;
    const f = feldDef(d.feld);
    if (f.art === 'aus') { oeffneRichtungsauswahl(d.gruppe, d.feld); return; }
    const liste = ZYKLUS[f.art];
    const jetztWert = gruppeWerte(d.gruppe)[d.feld];
    const i = liste.indexOf(jetztWert);
    feldSetzen(d.gruppe, d.feld, liste[(i + 1) % liste.length]);
  },
  // Auswahlknöpfe und Windrose. Im Fenster bleibt die Windrose offen und zeigt, wohin der gewählte Wind weht.
  'feld-wert': function (d) {
    const imFenster = !$('#modal').hidden && !!$('#modal-inhalt .windrose');
    feldSetzen(d.gruppe, d.feld, d.wert);
    if (imFenster) {
      $('#modal-inhalt').innerHTML = htmlRichtungsauswahl(d.gruppe, d.feld);
      fokusAuf('#modal-inhalt [data-wert="' + d.wert + '"]');
    }
  },
  'denkanstoss': function (d) {
    const def = schrittDef(d.schritt);
    const teil = teilVon(d.schritt);
    const z = sz(d.schritt);
    if (z.stufe < 1) {
      // Zuschnitt: Ist nur ein Feld des Schritts falsch und ohnehin klar, welches, passen Denkanstoß und Fragen genau dazu
      const falsch = falscheFelder(teil, def);
      z.zuschnitt = falsch.length === 1 && falscheErkennbar(teil, def) ? falsch[0] : null;
      z.stufe = 1; z.t1 = jetzt(); hilfeZaehlen(d.schritt); speichern();
    }
    teilNeu();
  },
  'stufe2': function (d) {
    const def = schrittDef(d.schritt);
    const z = sz(d.schritt);
    if (z.stufe === 1 && jetzt() >= z.t1 + zeit('T_STUFE2')) {
      z.stufe = 2; z.t2 = jetzt(); z.auswahl = fragenAuswahl(def, z); z.fragen = [neueFrage()];
      hilfeZaehlen(d.schritt); speichern();
    }
    teilNeu();
  },
  'antwort': function (d) {
    const def = schrittDef(d.schritt);
    const z = sz(d.schritt);
    const fz = z.fragen[+d.frage];
    if (!fz || fz.geloest || fz.sperreBis > jetzt()) return;
    const o = frageDef(def, z, +d.frage).optionen[+d.option];
    if (o.richtig) { fz.geloest = true; fz.letzte = null; }
    else {
      if (fz.versucht.indexOf(+d.option) < 0) fz.versucht.push(+d.option);
      fz.letzte = +d.option;
      fz.sperreVon = jetzt();
      fz.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
    }
    speichern();
    teilNeu();
  },
  'naechste-frage': function (d) {
    const z = sz(d.schritt);
    const letzte = z.fragen[z.fragen.length - 1];
    if (letzte && letzte.geloest && z.fragen.length < z.auswahl.length && jetzt() >= letzte.gezeigt + zeit('T_ZWISCHEN_FRAGEN')) {
      z.fragen.push(neueFrage());
      speichern();
    }
    teilNeu();
  },
  'stufe3': function (d) {
    const def = schrittDef(d.schritt);
    const z = sz(d.schritt);
    if (z.stufe === 2 && stufe3Frei(def, z)) {
      z.stufe = 3; z.t3 = jetzt();
      hilfeZaehlen(d.schritt); speichern();
      teilNeu();
      nachOben('#stufe3-' + def.id);
      if (def.neueKarte && !istKarteFrei(def.neueKarte)) {
        ui.animNachKarte = def.id;
        karteFreischalten([def.neueKarte]);
      }
      return;
    }
    teilNeu();
  },
  'nochmal': function (d) { vergleichAbspielen(d.schritt); },
  'richtung': function (d) { werkzeugSetzen(d.werkzeug, d.richtung, d.seite); },
  'skizze-gross': function (d) {
    ui.skizzeGross = d.skizze;
    zeichneSkizzeGross();
    const k = $('#gross-overlay [data-aktion="skizze-gross-zu"]');
    if (k) k.focus();
  },
  'skizze-gross-zu': function () {
    const key = ui.skizzeGross;
    ui.skizzeGross = null;
    const ov = $('#gross-overlay');
    ov.hidden = true; ov.innerHTML = '';
    const k = $('[data-aktion="skizze-gross"][data-skizze="' + key + '"]');
    if (k) k.focus({ preventScroll: true });
  },

  'kompass': function (d) {
    const pz = pruefZustand(d.gruppe);
    if (pz.bestanden) return;
    pz.werte[d.eintrag] = d.wert;
    delete pz.ergebnis[d.eintrag];
    ui.hinweis[d.gruppe] = '';
    speichern();
    blockNeu('p3');
  },
  'pruefen': function (d) {
    const gruppe = d.gruppe;
    if (gruppe === 'teil1' || gruppe === 'teil2') { schemaPruefen(gruppe); return; }
    // Profi-Aufgaben P1 (Namen der Zellen) und P3 (Südhalbkugel)
    const pz = pruefZustand(gruppe);
    if (pz.bestanden || pz.sperreBis > jetzt()) return;
    const eintraege = pruefEintraege(gruppe);
    const texte = gruppe === 'p1' ? CONTENT.teil1.profi.p1 : CONTENT.teil2.pruefen;
    if (eintraege.some(function (e) { return !pz.werte[e.id]; })) {
      ui.hinweis[gruppe] = texte.unvollstaendig;
      blockNeu(gruppe);
      return;
    }
    ui.hinweis[gruppe] = '';
    let alle = true;
    eintraege.forEach(function (e) {
      const w = pz.werte[e.id];
      const richtig = Array.isArray(e.richtig) ? e.richtig : [e.richtig];
      const erg = richtig.indexOf(w) >= 0 ? 'ok' : ((e.fast && e.fast.indexOf(w) >= 0) ? 'fast' : 'nein');
      pz.ergebnis[e.id] = erg;
      if (erg !== 'ok') { alle = false; pz.fehl[e.id] = (pz.fehl[e.id] || 0) + 1; }
    });
    if (alle) pz.bestanden = true;
    else { pz.sperreVon = jetzt(); pz.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER'); }
    speichern();
    blockNeu(gruppe);
  },
  // Rückfragen: Mehrfachauswahl an- und abwählen
  'rf-wahl': function (d) {
    const z = rfZustand(d.teil, d.key);
    if (z.geloest || z.sperreBis > jetzt()) return;
    const j = +d.option;
    const k = z.wahl.indexOf(j);
    if (k >= 0) z.wahl.splice(k, 1); else z.wahl.push(j);
    speichern();
    teilNeu();
  },
  // Rückfragen: Mehrfachauswahl prüfen (richtig nur, wenn genau alle richtigen Antworten gewählt sind)
  'rf-pruefen': function (d) {
    const R = rfDef(d.teil, d.key);
    const z = rfZustand(d.teil, d.key);
    if (z.geloest || z.sperreBis > jetzt() || !z.wahl.length) return;

let meldungUhr = null;

  const el = $('#meldung');

function quizEingabeOffen() { return !!ui.quiz && !ui.quiz.geprueft && !quizGesperrt(ui.quiz); }

// Rückfrage auswerten: richtig = weiter im Ablauf, falsch = erst Hilfe (Tipp) und Sperrzeit,
// nach zwei Fehlern zusätzlich der Denkanstoß des passenden Schritts
function rfAuswerten(teil, key, z, ok, option) {
  if (ok) {
    z.geloest = true;
    z.falsch = false;
    bestandenPruefen(teil);
    ui.zumAblauf = teil;
    // Der bestätigte Eintrag wird im Schema grün; die Meldung sagt das, auch wenn das Schema gerade nicht zu sehen ist
    zeigeMeldung(alleFelderStimmen(teil) ? ST.meldungRf : fmt(ST.meldungBestaetigt, { s: rfBezug(teil, key) }));
  } else {
    z.falsch = true;
    z.letzte = option;
    z.fehl += 1;
    if (z.fehl === 2) hilfeZaehlen((schrittDef(key) || einheiten(teil).find(function (d) { return d.felder.indexOf(key) >= 0; })).id);
    z.sperreVon = jetzt();
    z.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
  }
  speichern();
  teilNeu();
}

/* ----- Texte bearbeiten (Lehrkraft-Bereich) -----
   Änderungen gelten sofort auf diesem Gerät (gespeichert unter eigenem Namen, bleiben beim Zurücksetzen).
   „Datei herunterladen“ schreibt sie fest in eine neue HTML-Datei, die man an alle iPads verteilt. */
const TEXT_AUSLASSEN = ['id', 'art', 'richtig', 'felder', 'wenn', 'karten', 'bild', 'skizze', 'stuetzen', 'satzbausteine', 'startFeld',
  'nach', 'obenTyp', 'untenTyp', 'kachel', 'niveau', 'typ', 'thema', 'globus', 'loesung'];
let textListe = null;
function bearbeitbareTexte() {
  if (textListe) return textListe;
  textListe = [];
  (function gehe(o, pfad, schluessel) {
    if (typeof o === 'string') {
      if (TEXT_AUSLASSEN.indexOf(schluessel) >= 0 || !/[A-Za-zÄÖÜäöüß]/.test(o)) return;
      if (/^(W\d{1,2}|S\d)$/.test(o) && schluessel !== 'nr') return;   // Kennungen wie W5 oder S1
      if (/(^|\.)felder\.[^.]+\.(fast|fehlerbilder)(\.|$)/.test(pfad)) return;
      textListe.push(pfad);
      return;
    }
    if (o && typeof o === 'object') Object.keys(o).forEach(function (k) { gehe(o[k], pfad ? pfad + '.' + k : k, Array.isArray(o) ? schluessel : k); });
  })(ORIGINAL, '', '');
  return textListe;
}
function textJetzt(p) { return Object.prototype.hasOwnProperty.call(textAenderungen, p) ? textAenderungen[p] : wertAnPfad(ORIGINAL, p); }
// Lesbarer Ort eines Textes, zum Beispiel "Teil 1 › schritte › S2 › denkanstoss"
function pfadLabel(p) {
  const L = CONTENT.lehrkraft;
  let o = ORIGINAL;
  return p.split('.').map(function (k, i) {
    const wert = o ? o[k] : undefined;
    let teil = k;
    if (i === 0) teil = L.texteBereiche[k] || k;
    else if (Array.isArray(o)) teil = (wert && typeof wert === 'object' && (wert.nr || wert.id)) ? (wert.nr || wert.id) : String(+k + 1);
    o = wert;
    return teil;
  }).join(' › ');
}
function texteSpeichern() {
  try { window.localStorage.setItem(TEXTE_SCHLUESSEL, JSON.stringify(textAenderungen)); } catch (e) { /* ohne Speicher nur bis zum Neuladen */ }
}
function htmlTextEditor() {
  const L = CONTENT.lehrkraft;
  const n = Object.keys(textAenderungen).length;
  let h = '<div class="karte-box text-editor" id="block-texte"><h2>' + esc(L.texteTitel) + '</h2><p class="einleitung">' + esc(L.texteEinleitung) + '</p>';
  h += '<div class="such-zeile"><input type="search" class="eingabe text-suche" id="text-suche" data-eingabe="text-suche" autocomplete="off" placeholder="' + esc(L.texteSuche) + '" aria-label="' + esc(L.texteSuche) + '" value="' + esc(ui.textSuche) + '">' +
    '<select class="eingabe" data-eingabe="text-bereich" aria-label="' + esc(L.texteBereich) + '"><option value="alle">' + esc(L.texteAlle) + '</option>' +
    Object.keys(L.texteBereiche).filter(function (k) { return k in ORIGINAL; }).map(function (k) {
      return '<option value="' + k + '"' + (ui.textBereich === k ? ' selected' : '') + '>' + esc(L.texteBereiche[k]) + '</option>';
    }).join('') + '</select></div>';
  h += '<div id="text-treffer">' + htmlTextTreffer() + '</div>';
  h += '<p class="text-stand" id="text-stand">' + esc(fmt(L.texteGeaendert, { n: n })) + '</p>';

  if (n && !ui.textVerwerfenFrage) h += '<button type="button" class="knopf" data-aktion="text-verwerfen">' + esc(L.texteVerwerfen) + '</button>';
  h += '</div>';

      '<button type="button" class="knopf knopf-warnung" data-aktion="text-verwerfen-ja">' + esc(L.texteVerwerfenJa) + '</button>' +

  }
  return h + '<p class="hinweis-leise">' + esc(L.texteHinweis) + '</p></div>';

function htmlTextTreffer() {
  const L = CONTENT.lehrkraft;
  const q = ui.textSuche.trim().toLowerCase();
  if (!q && ui.textBereich === 'alle') return '<p class="hinweis-leise">' + esc(L.texteSuchen) + '</p>';
  const treffer = bearbeitbareTexte().filter(function (p) {
    if (ui.textBereich !== 'alle' && p.split('.')[0] !== ui.textBereich) return false;
    // auch im Originaltext suchen, damit ein Eintrag beim Tippen nicht aus der Liste verschwindet
    return !q || (pfadLabel(p) + ' ' + textJetzt(p) + ' ' + wertAnPfad(ORIGINAL, p)).toLowerCase().indexOf(q) >= 0;
  });
  const zeigen = treffer.slice(0, 40);
  let h = '<p class="hinweis-leise" role="status">' + esc(treffer.length > zeigen.length ? fmt(L.texteTrefferViele, { z: zeigen.length, n: treffer.length }) : fmt(L.texteTreffer, { n: treffer.length })) + '</p>';
  zeigen.forEach(function (p) {

    h += '<div class="text-eintrag' + (an ? ' geaendert' : '') + '"><div class="text-pfad">' + esc(pfadLabel(p)) + (an ? ' <span class="text-marke">' + esc(L.texteGeaendertMarke) + '</span>' : '') + '</div>' +
      '<textarea class="freitext text-feld" data-eingabe="text-wert" data-pfad="' + esc(p) + '" rows="' + Math.min(8, Math.ceil(wert.length / 60) + 1) + '" aria-label="' + esc(pfadLabel(p)) + '">' + esc(wert) + '</textarea>' +
      (an ? '<div class="knopf-reihe" style="margin-top:6px"><button type="button" class="knopf knopf-klein" data-aktion="text-original" data-pfad="' + esc(p) + '">' + esc(L.texteOriginal) + '</button></div>' : '') + '</div>';
  });

function textTrefferNeu(fokusPfad, pos) {
  const box = $('#text-treffer');

// Einen Text ändern (leer gelassen oder wie im Original: Änderung entfernen)
function textAendern(p, wert) {
  if (wert === wertAnPfad(ORIGINAL, p)) delete textAenderungen[p]; else textAenderungen[p] = wert;
  wertSetzen(CONTENT, p, typografie(textJetzt(p)));
  texteSpeichern();
}
// Neue Datei: geänderte Texte direkt im Quelltext ersetzen; was dort nicht eindeutig steht, kommt in einen Block am Ende von CONTENT
function jsText(s) {
  return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n').replace(/<\/(script)/gi, '<\\/$1') + "'";
}
function dateiMitAenderungen() {
  const start = QUELLTEXT.indexOf('const CONTENT = {');
  const ende = QUELLTEXT.indexOf('<\/script>', start);   // "<\/": sonst endet hier das Skript
  let inhalt = QUELLTEXT.slice(start, ende);
  const rest = {};
  Object.keys(textAenderungen).forEach(function (p) {
    const alt = jsText(wertAnPfad(ORIGINAL, p));
    if (inhalt.split(alt).length === 2) inhalt = inhalt.replace(alt, function () { return jsText(textAenderungen[p]); });
    else rest[p] = textAenderungen[p];
  });
  if (Object.keys(rest).length) {
    inhalt += '\n/* Geänderte Texte aus dem Lehrkraft-Bereich, die oben nicht eindeutig zu finden waren */\n' +
      'window.TEXT_AENDERUNGEN = Object.assign(window.TEXT_AENDERUNGEN || {}, {\n' +
      Object.keys(rest).map(function (p) { return '  ' + jsText(p) + ': ' + jsText(rest[p]); }).join(',\n') + '\n});\n';
  }
  return QUELLTEXT.slice(0, start) + inhalt + QUELLTEXT.slice(ende);
}
function textDateiHerunterladen() {
  const blob = new Blob([dateiMitAenderungen()], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = CONTENT.lehrkraft.texteDateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
}
Object.assign(AKTIONEN, {

  'zeiten': function (form) {
    const neueZeiten = {};
    ['T_STUFE2', 'T_ZWISCHEN_FRAGEN', 'T_SPERRE_FEHLER', 'T_STUFE3'].forEach(function (k) {
      const v = parseFloat(String(form.elements[k].value).replace(',', '.'));
      if (!isNaN(v) && v >= 0) neueZeiten[k] = Math.min(900, v);
    });
    zustand.einstellungen.zeiten = neueZeiten;
    speichern();
    ui.meldung = 'zeiten';
    neu(zeichneLehrkraft);
  }
};

/* ----- Eingaben: Freitexte, Häkchen, Auswahllisten ----- */
const EINGABEN = {
  'text-suche': function (el) { ui.textSuche = el.value; textTrefferNeu(); },
  'text-bereich': function (el) { ui.textBereich = el.value; textTrefferNeu(); },
  'text-wert': function (el) {
    const p = el.dataset.pfad;
    const vorher = Object.prototype.hasOwnProperty.call(textAenderungen, p);
    textAendern(p, el.value);
    // Markierung „geändert“ erneuern, ohne die Eingabe zu stören
    if (vorher !== Object.prototype.hasOwnProperty.call(textAenderungen, p)) textTrefferNeu(p, el.selectionStart);
    else { const st = $('#text-stand'); if (st) st.textContent = fmt(CONTENT.lehrkraft.texteGeaendert, { n: Object.keys(textAenderungen).length }); }
  },
  'freitext': function (el) {
    const ziel = el.dataset.ziel;
    let z;
    if (ziel === 'p2') z = zustand.profi.p2;
    else if (ziel === 'p4') z = zustand.profi.p4;
    else z = abfrageZustand(el.dataset.id);
    z.text = el.value;
    speichern();
    const knopf = document.getElementById(el.dataset.knopf);
    const lang = freitextLang(el.value);
    if (knopf) knopf.disabled = !lang;
    const hinweis = document.getElementById(el.dataset.knopf + '-hinweis');
    if (hinweis) hinweis.hidden = lang;
  },
  'haken': function (el) {
    const i = +el.dataset.i;
    if (el.dataset.ziel === 'p2') { zustand.profi.p2.check[i] = el.checked; speichern(); return; }
    const z = abfrageZustand(el.dataset.id);
    z.check[i] = el.checked;
    speichern();
    const a = CONTENT.abfrage.auftraege.find(function (x) { return x.id === el.dataset.id; });
    const aus = document.getElementById('abfrage-auswertung-' + el.dataset.id);
    if (aus && a) aus.innerHTML = abfrageAuswertung(a, z);
  },
  'luecke': function (el) {
    if (!quizEingabeOffen() || ui.quiz.fest[+el.dataset.i]) return;
    ui.quiz.luecken[+el.dataset.i] = el.value;
    const r = zustand.quiz.runde;
    const k = $('#quiz-pruefen');
    if (k && r) k.disabled = !quizVollstaendig(quizFrage(r.folge[r.pos]), ui.quiz);
  },
  'zeitdruck': function (el) {
    zustand.einstellungen.zeitdruck = el.checked;
    speichern();
  }
};

/* ----- Ereignisse verbinden ----- */
document.addEventListener('click', function (ev) {
  if (ev.target === $('#modal')) { schliesseModal(); return; }
  const ziel = ev.target.closest('[data-aktion]');
  if (!ziel || ziel.disabled) return;
  const fn = AKTIONEN[ziel.dataset.aktion];
  if (fn) { ev.preventDefault(); fn(ziel.dataset, ziel); }
});
document.addEventListener('submit', function (ev) {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fn = FORMULARE[form.dataset.form];
  if (fn) fn(form);
});
document.addEventListener('input', function (ev) {
  const el = ev.target;
  if ((el.tagName === 'TEXTAREA' || el.type === 'search') && el.dataset.eingabe && EINGABEN[el.dataset.eingabe]) EINGABEN[el.dataset.eingabe](el);
});
document.addEventListener('change', function (ev) {
  const el = ev.target;
  if (el.tagName !== 'TEXTAREA' && el.type !== 'search' && el.dataset && el.dataset.eingabe && EINGABEN[el.dataset.eingabe]) EINGABEN[el.dataset.eingabe](el);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (!$('#modal').hidden) schliesseModal();
  else if (!$('#karten-overlay').hidden) AKTIONEN['karten-zu']();
  else if (baukastenOffen()) schliesseBaukasten();
  else if (ui.skizzeGross) AKTIONEN['skizze-gross-zu']();
  else if (ui.gross) AKTIONEN['lk-gross-zu']();
});

/* ----- Start ----- */
function start() {
  document.documentElement.lang = 'de';
  $('#titel').textContent = A.titel;
  $('#untertitel').textContent = A.untertitel;
  $('#baukasten-text').textContent = A.baukastenKnopf;
  $('#baukasten-text-kurz').textContent = A.baukastenKurz;
  $('#baukasten-knopf').setAttribute('aria-label', A.baukastenKnopf);
  $('#baukasten-zu').textContent = A.schliessen;
  // Leiste unten: kurze Namen, vorgelesen wird der ganze Name
  $('#tabs').setAttribute('aria-label', A.bereicheLabel);
  ['teil1', 'teil2', 'quiz'].forEach(function (t) { $('#tab-text-' + t).textContent = A.tabsKurz[t]; $('#tab-' + t).setAttribute('aria-label', A.tabs[t]); });
  $('#tab-lehrkraft').setAttribute('aria-label', A.tabs.lehrkraft);
  // Schriftgröße
  $('#schrift-kleiner').setAttribute('aria-label', A.schriftKleiner);
  $('#schrift-kleiner').setAttribute('title', A.schriftKleiner);
  $('#schrift-groesser').setAttribute('aria-label', A.schriftGroesser);
  $('#schrift-groesser').setAttribute('title', A.schriftGroesser);
  schriftAnwenden();
  $('#tab-lehrkraft').setAttribute('title', A.tabs.lehrkraft);
  if (!speicherOk) { const h = $('#speicher-hinweis'); h.textContent = A.ohneSpeicher; h.hidden = false; }
  // Schalter für die dunkle Ansicht
  $('#ansicht-text').textContent = A.dunkel;
  $('#ansicht-schalter').setAttribute('aria-label', A.dunkelLang);
  ansichtAnwenden();
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const folgen = function () { if (zustand.einstellungen.dunkel !== true && zustand.einstellungen.dunkel !== false) ansichtAnwenden(); };
    if (mq.addEventListener) mq.addEventListener('change', folgen); else if (mq.addListener) mq.addListener(folgen);
  }
  // Knopf „Neu starten“ (in CONFIG abschaltbar)
  const ns = $('#neustart-knopf');
  if (CONFIG.NEUSTART_KNOPF) {
    $('#neustart-text').textContent = A.neustartKnopf;
    ns.setAttribute('aria-label', A.neustartKnopf);
    ns.hidden = false;
  } else ns.remove();
  if (zustand.tab === 'lehrkraft') zustand.tab = 'teil1';   // Lehrkraft-Bereich nie von selbst öffnen
  allesZeichnen();
  window.setInterval(takt, 250);
}
start();
})();
</script>
