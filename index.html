// Skizze mit Feldern zum Antippen. Auf schmalen Bildschirmen erscheinen darunter Auswahlknöpfe.
// c.jetzt: Felder, zu denen es gerade Hilfe gibt (werden hervorgehoben)
// c.bezug: Felder des Bereichs, um den es in der offenen Rückfrage geht (nur markiert, nicht änderbar)
function htmlTippSkizze(c) {
  const werte = gruppeWerte(c.gruppe);
  const ergebnis = sichtbaresErgebnisVon(c.gruppe) || {};
  const jetztDran = c.jetzt || [];
  const bezug = c.bezug || [];
  const aus = c.aus;
  let h = '<div class="tipp-skizze" style="max-width:' + c.maxBreite + 'px">';
  if (c.titel) h += '<div class="skizze-titel">' + esc(c.titel) + '</div>';
  // --einheiten: Breite der Skizze in Skizzen-Koordinaten, damit die Schrift in den Feldern mitwächst
  h += '<div class="tipp-flaeche" style="--einheiten:' + aus[2] + '">' + c.svg.replace(/<\/svg>$/, feldSvg(c, werte, ergebnis) + '</svg>');
  c.felder.forEach(function (id) {
    const p = feldPos(c.art, id);
    const wert = werte[id];
    const erg = ergebnis[id];
    const offen = feldOffen(c.gruppe, id);
    let cls = 'feld feld-art-' + feldDef(id).art + (wert ? ' gesetzt' : '');
    if (erg === 'ok') cls += ' ok'; else if (erg === 'nein') cls += ' nein'; else if (erg === 'fast') cls += ' fast';
    if (offen && jetztDran.indexOf(id) >= 0) cls += ' jetzt';
    if (bezug.indexOf(id) >= 0) cls += ' bezug';
    if (c.start === id) cls += ' start';
    const marke = erg === 'ok' ? '✓' : (erg === 'nein' || erg === 'fast' ? '!' : '');
    h += '<button type="button" class="' + cls + '" style="left:' + r1((p[0] - aus[0]) / aus[2] * 100) + '%;top:' + r1((p[1] - aus[1]) / aus[3] * 100) + '%;width:' + r1(p[2] / aus[2] * 100) + '%;height:' + r1(p[3] / aus[3] * 100) + '%"' +
      ' data-aktion="feld" data-gruppe="' + c.gruppe + '" data-feld="' + id + '" aria-label="' + esc(feldDef(id).text + ': ' + (wert ? feldWertText(id, wert) : '?') + (offen ? '. ' + ST.feldAendern : '')) + '"' + (offen ? '' : ' disabled') + '>' +
      feldInhalt(id, wert) + (marke ? '<span class="feld-marke" aria-hidden="true">' + marke + '</span>' : '') + '</button>';
    // Fähnchen "Start" über dem Feld, mit dem die Gruppe beginnen soll
    if (c.start === id) h += '<span class="start-marke" aria-hidden="true" style="left:' + r1((p[0] + p[2] / 2 - aus[0]) / aus[2] * 100) + '%;top:' + r1((p[1] - aus[1]) / aus[3] * 100) + '%">' + esc(ST.startLabel) + '</span>';
  });
  h += '</div><div class="feld-liste">';
  c.felder.forEach(function (id) {
    const erg = ergebnis[id];
    const offen = feldOffen(c.gruppe, id);
    if (!offen && werte[id]) {
      // Gesperrte Felder nur kurz zusammengefasst (spart auf dem Handy viel Platz)
      const istBezug = bezug.indexOf(id) >= 0;
      h += '<div class="feld-zeile kompakt' + (istBezug ? ' bezug' : '') + '"><span class="feld-zeile-text">' + esc(feldMitWert(id, werte[id])) + '</span>' +
        (istBezug ? ' <span class="jetzt-marke">' + esc(ST.feldRueckfrage) + '</span>' : '') +
        (erg ? ' ' + htmlBewertungsMarke(erg, c.texte) : '') + '</div>';
      return;
    }
    const jetzt = offen && jetztDran.indexOf(id) >= 0;
    const start = c.start === id;
    h += '<div class="feld-zeile' + (jetzt ? ' jetzt' : '') + '"><div class="feld-zeile-text">' + esc(feldDef(id).text) + (jetzt ? ' <span class="jetzt-marke">' + esc(ST.feldJetzt) + '</span>' : '') +
      (start ? ' <span class="jetzt-marke">' + esc(ST.startLabel) + '</span>' : '') + '</div>' + htmlFeldWahl(c.gruppe, id);
    if (erg) h += '<div class="eintrag-rueck">' + htmlBewertungsMarke(erg, c.texte) + '</div>';
    h += '</div>';
  });
  return h + '</div></div>';
}
function htmlBewertungsMarke(erg, texte) {
  const T = texte || {};
  if (erg === 'ok') return '<span class="marke-ok">✓ ' + esc(T.stimmt || ST.passt) + '</span>';
  if (erg === 'fast') return '<span class="marke-nicht">' + esc(T.fast || ST.fast) + '</span>';
  return '<span class="marke-nicht">' + esc(T.nochNicht || ST.passtNicht) + '</span>';
}

/* ----- Das ganze Schema eines Teils ----- */
function schemaGrundlage(teil) {
  if (teil === 'teil1') return { art: 'v', aus: [0, 0, 1000, 442], titel: CONTENT.skizzen.vertikalTitel, svg: function (aus) { return skizzeVertikal(['temperatur', 'passat'], { grau: ['passat'], ausschnitt: aus }); } };
  return { art: 'd', aus: [0, 0, 600, 780], titel: CONTENT.skizzen.draufsichtTitel, svg: function (aus) { return skizzeDraufsicht(GUERTEL.concat(['bamberg', 'bamberg-label']), { ausschnitt: aus }); } };
}
// Schema als Bild mit den Einträgen als Zeichen (Großansicht und Ausschnitt in der Hilfe)
function schemaBild(teil, aus) {
  const g = schemaGrundlage(teil);
  const a = aus || g.aus;
  const pz = zustand.pruefung[teil];
  // Im Ausschnitt nur Felder zeigen, die ganz hineinpassen
  const felder = CONTENT[teil].pruefen.felder.filter(function (id) {

    return p[0] >= a[0] && p[1] >= a[1] && p[0] + p[2] <= a[0] + a[2] && p[1] + p[3] <= a[1] + a[3];

  return g.svg(a).replace(/<\/svg>$/, feldSvg({ art: g.art, felder: felder }, pz.werte, sichtbaresErgebnis(teil), 'feld-svg-immer') + '</svg>');

/* ----- Richtungswerkzeug (Teil 2) ----- */

/* ---------- Countdown ---------- */

/* =====================================================================
   BEREICH A und B: HILFE TEIL 1 und TEIL 2
   Ablauf eines Teils:
   1. Eintragen: das ganze Schema ausfüllen und prüfen.
   2. Rückfragen zu den Einträgen, die beim ersten Prüfen schon stimmen.
   3. Hilfe zu den anderen Einträgen, ein Schritt nach dem anderen. Die Hilfe zu einem
      Schritt (S1 bis S8) erscheint nur bei Bedarf, ist auf die Antworten der Gruppe
      zugeschnitten und baut auf ihren richtigen Einträgen auf.
   4. Zum Schluss Rückfragen zu korrigierten Einträgen, danach die Vertiefungsfragen.
   ===================================================================== */
const bereiche = {
  teil1: $('#bereich-teil1'), teil2: $('#bereich-teil2'),
  lehrkraft: $('#bereich-lehrkraft')
};

function hilfeText(teil) {
  const n = zustand.hilfen[teil];
  if (n === 0) return A.hilfeZaehlerKeine;
  if (n === 1) return A.hilfeZaehlerEins;
  return fmt(A.hilfeZaehlerViele, { n: n });
}

/* ----- Wo steht die Gruppe gerade? ----- */
// Schritte eines Teils, deren Felder alle im Schema geprüft werden
function einheiten(teil) {
  const felder = CONTENT[teil].pruefen.felder;
  return CONTENT[teil].schritte.filter(function (def) { return def.felder.every(function (id) { return felder.indexOf(id) >= 0; }); });
}
function feldStimmt(teil, id) { return zustand.pruefung[teil].ergebnis[id] === 'ok'; }
function einheitStimmt(teil, def) { return def.felder.every(function (id) { return feldStimmt(teil, id); }); }
function einheitErstRichtig(teil, def) {
  const e = zustand.pruefung[teil].erste;
  return !!e && def.felder.every(function (id) { return e[id] === 'ok'; });
}
// Schritte mit Hilfe: alle, die beim ersten Prüfen nicht ganz richtig waren
function hilfeEinheiten(teil) { return einheiten(teil).filter(function (def) { return !einheitErstRichtig(teil, def); }); }
function alleFelderStimmen(teil) { return CONTENT[teil].pruefen.felder.every(function (id) { return feldStimmt(teil, id); }); }

/* ----- Schrittweise aufdecken -----
   Nach dem Prüfen sieht die Gruppe nur, wie viele Einträge stimmen, nicht welche.
   Ein richtiger Eintrag wird erst grün, wenn die Rückfrage dazu gelöst ist oder er in der Hilfe korrigiert wurde.
   Welcher Eintrag im Schritt mit Hilfe falsch ist, zeigt sich erst beim Teilergebnis,
   außer es ist ohnehin klar, weil alle anderen Einträge des Schritts schon bestätigt sind. */
function einheitVon(teil, id) { return einheiten(teil).find(function (d) { return d.felder.indexOf(id) >= 0; }); }
// Bewertung beim letzten Prüfen (ändert sich nicht, solange die Gruppe nur Felder umstellt)
function letzteBewertung(teil, id) { return feldBewertung(id, zustand.pruefung[teil].geprueft[id]); }
function feldBestaetigt(teil, id) {
  const pz = zustand.pruefung[teil];
  if (!pz.erste || !feldStimmt(teil, id)) return false;
  if (alleFelderStimmen(teil)) return true;
  const def = einheitVon(teil, id);
  const geloest = function (k) { return !!pz.rf[k] && pz.rf[k].geloest; };
  if (rfRundeFertig(teil) && (geloest(id) || (def && geloest(def.id)))) return true;
  // In der Hilfe richtig korrigiert oder Schritt mit Hilfe ganz geschafft
  return !!def && hilfeEinheiten(teil).indexOf(def) >= 0 && (pz.erste[id] !== 'ok' || einheitStimmt(teil, def));
}
// Ist ohnehin klar, welche Einträge des Schritts falsch sind? Ja, wenn alle anderen bestätigt sind.
function falscheErkennbar(teil, def) {
  return def.felder.every(function (id) { return letzteBewertung(teil, id) !== 'ok' || feldBestaetigt(teil, id); });
}
function falscheFelder(teil, def) { return def.felder.filter(function (id) { return letzteBewertung(teil, id) !== 'ok'; }); }
function falscheZeigen(teil, def) { return sz(def.id).stufe >= 3 || falscheErkennbar(teil, def); }
// Was die Gruppe von der Bewertung eines Feldes sieht: 'ok', 'nein', 'fast' oder '' (noch verdeckt)
function sichtbareBewertung(teil, id) {
  const pz = zustand.pruefung[teil];
  const erg = pz.ergebnis[id];
  if (!pz.erste || !erg) return '';
  if (erg === 'ok') return feldBestaetigt(teil, id) ? 'ok' : '';
  const st = ablaufStand(teil);
  if (st.phase !== 'hilfe' || st.def.felder.indexOf(id) < 0) return '';
  return falscheZeigen(teil, st.def) ? erg : '';
}
function sichtbaresErgebnis(teil) {
  const e = {};
  CONTENT[teil].pruefen.felder.forEach(function (id) { const b = sichtbareBewertung(teil, id); if (b) e[id] = b; });
  return e;
}

// Ergebnis: phase 'eintragen', 'rueckfragen' (etappe 'A' am Anfang, 'C' am Ende), 'hilfe' (def = Schritt) oder 'fertig'
function ablaufStand(teil) {
  const pz = zustand.pruefung[teil];
  if (!pz.erste) return { phase: 'eintragen' };
  if (pz.bestanden) return { phase: 'fertig' };
  if (pz.rfListe.some(function (k) { return !rfZustand(teil, k).geloest; })) return { phase: 'rueckfragen', etappe: 'A' };
  const falsch = einheiten(teil).find(function (def) { return !einheitStimmt(teil, def); });
  if (falsch) return { phase: 'hilfe', def: falsch };
  if (pz.rf2Liste.some(function (k) { return !rfZustand(teil, k).geloest; })) return { phase: 'rueckfragen', etappe: 'C' };
  return { phase: 'fertig' };
}

/* ----- Rückfragen (Schlüssel = Schritt, zum Beispiel 'S1', oder einzelnes Feld, zum Beispiel 'pol-luft') ----- */
// Schlüssel: Schritt ('S1'), einzelnes Feld ('pol-luft') oder '?S1' = neutrale Rückfrage zum Bereich.
// Die neutrale Rückfrage ist eine Frage zum Weiterdenken (pruefFrage): Sie verrät nichts und bestätigt nichts.
function rfDef(teil, key) {
  if (key.charAt(0) === '?') { const def = schrittDef(key.slice(1)); return def ? def.fragen[def.pruefFrage || 0] : undefined; }
  return CONTENT[teil].pruefen.rueckfragen[key];
}
// Schritt, zu dem eine Rückfrage gehört
function rfEinheit(teil, key) {
  const id = key.charAt(0) === '?' ? key.slice(1) : key;
  return schrittDef(id) || einheitVon(teil, id);
}
function rfRundeFertig(teil) { return zustand.pruefung[teil].rfListe.every(function (k) { return rfZustand(teil, k).geloest; }); }
function rfZustand(teil, key) {
  const pz = zustand.pruefung[teil];
  if (!pz.rf[key]) pz.rf[key] = { wahl: [], versucht: [], letzte: null, falsch: false, geloest: false, fehl: 0, sperreVon: 0, sperreBis: 0 };
  return pz.rf[key];
}
// Darf die Rückfrage schon jetzt kommen, ohne etwas über einen falschen Eintrag zu verraten?
function rfFrei(teil, key) {
  const R = rfDef(teil, key);
  return !!R && (R.nach || []).every(function (id) { return einheitErstRichtig(teil, schrittDef(id)); });
}
// Gleich nach dem ersten Prüfen: zu jedem Schritt genau eine Rückfrage, in der Reihenfolge des Arbeitsblatts.
// Ganz richtig: Rückfrage zum Schritt. Teilweise richtig: Rückfrage zum richtigen Feld, falls es eine gibt.
// Sonst (oder wenn die Rückfrage etwas verraten würde): neutrale Frage zum Bereich.
// So ist nicht zu erkennen, welche Rückfragen zu richtigen und welche zu falschen Einträgen gehören.
function rueckfragenZuerst(teil) {
  const e = zustand.pruefung[teil].erste;
  return einheiten(teil).map(function (def) {
    const richtig = def.felder.filter(function (id) { return e[id] === 'ok'; });
    if (richtig.length === def.felder.length && rfFrei(teil, def.id)) return def.id;
    if (richtig.length < def.felder.length) {
      const feldRf = richtig.find(function (id) { return !!rfDef(teil, id) && rfFrei(teil, id); });
      if (feldRf) return feldRf;
    }
    return '?' + def.id;
  });
}
// Wenn alles stimmt: Rückfragen, die vorher etwas verraten hätten,
// und zu korrigierten Schritten, deren Fragen zum Weiterdenken nicht alle gelöst sind
function rueckfragenZumSchluss(teil) {
  const pz = zustand.pruefung[teil];
  return einheiten(teil).filter(function (def) {
    if (!rfDef(teil, def.id) || pz.rfListe.indexOf(def.id) >= 0) return false;
    return einheitErstRichtig(teil, def) || !fragenGeloest(def);
  }).map(function (def) { return def.id; });
}
function offeneRueckfragen(teil) {
  const pz = zustand.pruefung[teil];
  return pz.rfListe.concat(pz.rf2Liste).filter(function (k) { return !rfZustand(teil, k).geloest; });
}
// Alles geschafft? Dann sind die Vertiefungsfragen frei.
function bestandenPruefen(teil) {
  const pz = zustand.pruefung[teil];
  if (!pz.bestanden && pz.erste && alleFelderStimmen(teil) && !offeneRueckfragen(teil).length) pz.bestanden = true;
  return pz.bestanden;
}
// Angezeigt wird nur der Bereich, nicht das Feld (verrät sonst, welcher Eintrag gemeint ist)
function rfBezug(teil, key) {
  const def = rfEinheit(teil, key);
  return def.kurz + (def.nr ? ' (' + def.nr + ')' : '');
}
// Felder, die in der Skizze zur offenen Rückfrage markiert werden: aus demselben Grund immer der ganze Bereich
function rfBezugFelder(teil, st) {
  if (st.phase !== 'rueckfragen') return [];
  const pz = zustand.pruefung[teil];
  const key = (st.etappe === 'A' ? pz.rfListe : pz.rf2Liste).find(function (k) { return !rfZustand(teil, k).geloest; });
  const def = key ? rfEinheit(teil, key) : null;
  return def ? def.felder : [];
}

/* ----- Wegweiser: Eintragen, Rückfragen, Hilfe, Vertiefung ----- */
const SCHLOSS = '<svg viewBox="0 0 24 24" width="18" height="18" focusable="false"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
function htmlWeg(teil, st) {
  const W = ST.weg;
  const pz = zustand.pruefung[teil];
  const aktuell = st.phase === 'eintragen' ? 0 : (st.phase === 'fertig' ? 3 : (st.phase === 'hilfe' || st.etappe === 'C' ? 2 : 1));
  const entfaellt = [false, !!pz.erste && !pz.rfListe.length, !!pz.erste && !hilfeEinheiten(teil).length && !pz.rf2Liste.length, false];
  let h = '<ol class="weg" aria-label="' + esc(W.label) + '">';
  [W.eintragen, W.rueckfragen, W.hilfe, W.vertiefung].forEach(function (name, i) {
    let cls = 'weg-schritt';
    let marke = String(i + 1);
    let zusatz = '';
    if (i < aktuell) {
      if (entfaellt[i]) { cls += ' entfaellt'; zusatz = W.entfaellt; }
      else { cls += ' fertig'; marke = '✓'; }
    } else if (i === aktuell) {
      cls += ' jetzt';
    }
    if (i === 3 && !pz.bestanden) { cls += ' gesperrt'; marke = SCHLOSS; }
    h += '<li class="' + cls + '"' + (i === aktuell ? ' aria-current="step"' : '') + '><span class="weg-nr" aria-hidden="true">' + marke + '</span>' +
      '<span class="weg-text">' + esc(name) + (zusatz ? '<span class="weg-zusatz">' + esc(zusatz) + '</span>' : '') + '</span></li>';
  });
  return h + '</ol>';
}

/* ----- Das ganze Schema mit Feldern ----- */
function htmlSchema(teil, st) {
  const P = CONTENT[teil].pruefen;

    if (P.startHinweis) h += '<div class="start-hinweis"><span class="start-symbol" aria-hidden="true">⚑</span><p><strong>' + esc(ST.startTitel) + '</strong> ' + txt(P.startHinweis) + '</p></div>';
  }
  h += htmlTippSkizze({ gruppe: teil, felder: P.felder, art: g.art, aus: g.aus, maxBreite: teil === 'teil1' ? 1000 : 560, titel: g.titel,
    svg: g.svg(g.aus), texte: P, jetzt: st.phase === 'hilfe' ? st.def.felder : [], bezug: rfBezugFelder(teil, st),
    start: st.phase === 'eintragen' ? P.startFeld : null });

  } else {

    const r = P.felder.filter(function (id) { return letzteBewertung(teil, id) === 'ok'; }).length;
    const k = P.felder.filter(function (id) { return sichtbareBewertung(teil, id) === 'ok'; }).length;
    const n = P.felder.length;
    h += '<div class="fortschritt"><p class="ergebnis-zeile">' + esc(fmt(ST.ergebnisZeile, { r: r, n: n })) + '</p>' +
      '<p class="bestaetigt-zeile">' + esc(fmt(ST.bestaetigt, { k: k, n: n })) + '</p>' +
      '<div class="fortschritt-balken" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + k + '" aria-label="' + esc(fmt(ST.bestaetigt, { k: k, n: n })) + '">' +
      '<span style="width:' + Math.round(100 * k / n) + '%"></span></div></div>';
    if (!alleFelderStimmen(teil)) h += '<p class="hinweis-leise">' + esc(ST.verdeckt) + '</p>';
    h += '<p class="hinweis-leise">' + esc(st.phase === 'hilfe' ? fmt(ST.jetztDran, { kurz: st.def.kurz }) : ST.gesperrtWaehrendRf) + '</p>';

  return h + '</div>';
}

/* ----- Rückfragen: immer nur die erste offene Rückfrage zeigen ----- */
function htmlRueckfragenBlock(teil, st) {
  const pz = zustand.pruefung[teil];

  let h = '<div class="karte-box ablauf-box" id="block-ablauf"><h2 class="ablauf-titel" tabindex="-1">' + esc(titel) + '</h2><p>' + esc(einl) + '</p>';
  for (let i = 0; i < liste.length; i++) {

}
function htmlRueckfrage(teil, key, R, z, kopf) {
  const gesperrt = z.sperreBis > jetzt();
  const mitBildern = R.optionen.some(function (o) { return o.bild; });
  let h = '<div class="frage" id="rf-' + key.replace('?', 'n-') + '">' + kopf + (R.bild ? htmlBild(R.bild, 'bild-klein') : '') +
    '<p class="hinweis-leise">' + esc(R.mehrfach ? ST.rfMehrere : ST.rfEine) + '</p><div class="optionen' + (mitBildern ? ' bild-optionen' : '') + '">';
  // In der Datei stehen die richtigen Antworten meist vorn. Angezeigt wird je Gerät gemischt; j bleibt der Index in der Datei.
  festGemischt(zustand.mischung + '|' + teil + '|' + key, R.optionen.length).forEach(function (j) {
    const o = R.optionen[j];
    if (R.mehrfach) {
      const an = z.wahl.indexOf(j) >= 0;
      h += '<button type="button" class="option option-mehrfach' + (an ? ' gewaehlt' : '') + '" role="checkbox" aria-checked="' + an + '" data-aktion="rf-wahl" data-teil="' + teil + '" data-key="' + key + '" data-option="' + j + '"' + (gesperrt ? ' disabled' : '') + '>' +
        '<span class="kaestchen" aria-hidden="true">' + (an ? '✓' : '') + '</span><span>' + txt(o.text, false) + '</span></button>';
    } else {
      const versucht = z.versucht.indexOf(j) >= 0;
      h += '<button type="button" class="option' + (versucht ? ' versucht' : '') + '" data-aktion="rf-antwort" data-teil="' + teil + '" data-key="' + key + '" data-option="' + j + '"' + (gesperrt ? ' disabled' : '') + '>' +
        htmlOptionInhalt(o) + (versucht ? ' <span class="option-zusatz">(' + esc(ST.schonVersucht) + ')</span>' : '') + '</button>';
    }
  });
  h += '</div>';
  if (R.mehrfach) {
    h += '<div class="knopf-reihe"><button type="button" class="knopf knopf-primaer" data-aktion="rf-pruefen" data-teil="' + teil + '" data-key="' + key + '"' + ((gesperrt || !z.wahl.length) ? ' disabled' : '') + '>' + esc(ST.rfPruefen) + '</button></div>';
  }
  // Nach einem Fehler zuerst Hilfe: Tipp oder Rückfrage zur gewählten Antwort, dann Sperrzeit.
  // Nach zwei Fehlern erscheint zusätzlich der Denkanstoß des passenden Schritts.
  if (z.falsch) {
    const hilfe = R.mehrfach ? R.tipp : R.optionen[z.letzte].rueckfrage;
    h += '<div class="rueckmeldung rueckfrage" role="status"><strong>' + esc(ST.rfFalsch) + '</strong> ' + txt(hilfe) + '</div>';
    if (gesperrt) h += htmlCountdown(z.sperreVon, z.sperreBis, 'teil', ST.rfSperre);
  }
  if (z.fehl >= 2) h += htmlRfHilfe(teil, key);
  return h + '</div>';
}
function htmlRfHilfe(teil, key) {
  const def = rfEinheit(teil, key);
  return '<div class="rf-hilfe"><span class="stufe-label">' + esc(ST.rfHilfeTitel) + '</span><div class="denkanstoss' + (def.bild ? ' mit-bild' : '') + '"><p>' + txt(def.denkanstoss) + '</p>' +

}

/* ----- Hilfe zu einem Schritt, zugeschnitten auf die Antworten der Gruppe ----- */
function htmlHilfeEinheit(teil, st) {
  const def = st.def;

  h += '<p class="hilfe-aufgabe"><span class="aufgabe-label">' + esc(def.nr ? fmt(ST.aufgabeLabel, { nr: def.nr }) : ST.aufgabeOhneNr) + '</span>' + txt(def.aufgabe) + '</p>';

    '<div class="hilfe-text">' + htmlDiagnose(teil, def) + htmlAufbau(teil, def) + '</div></div>';

// Rückmeldung zum Bereich: wie viele Einträge noch nicht stimmen. Welche, erst wenn es ohnehin klar ist
// oder beim Teilergebnis. Der typische Fehler (Teil 2) erscheint erst nach dem Denkanstoß.
function htmlDiagnose(teil, def) {
  const pz = zustand.pruefung[teil];
  const P = CONTENT[teil].pruefen;
  const z = sz(def.id);
  const falsch = falscheFelder(teil, def);
  let h = '<div class="diagnose">';
  if (def.felder.length === 1) h += '<p class="lage">' + esc(letzteBewertung(teil, def.felder[0]) === 'fast' ? ST.lageFast : ST.lageEins) + '</p>';
  else h += '<p class="lage">' + esc(fmt(falsch.length === 1 ? ST.lageBereichEins : ST.lageBereich, { n: falsch.length, m: def.felder.length })) + '</p>';
  if (!falscheZeigen(teil, def)) return h + '<p class="hinweis-leise">' + esc(ST.lageVerdeckt) + '</p></div>';
  h += '<ul class="diagnose-liste">';
  falsch.forEach(function (id) {
    const f = feldDef(id);
    const wert = pz.geprueft[id];
    const fehler = z.stufe >= 1 && f.fehlerbilder && P.fehlerbilder ? P.fehlerbilder[f.fehlerbilder[wert]] : '';
    h += '<li><strong>' + esc(f.text) + ':</strong> <span class="marke-nicht">' + esc(letzteBewertung(teil, id) === 'fast' ? P.fast : ST.nochNicht) + '</span>' +
      (wert ? ' <span class="hinweis-leise">(' + esc(fmt(ST.euerEintrag, { wert: feldWertText(id, wert) })) + ')</span>' : '') +
      (fehler ? '<span class="fehlerbild">' + esc(fehler) + '</span>' : '') + '</li>';
  });
  return h + '</ul></div>';
}
// "Darauf baut ihr auf": richtige Einträge aus diesem und früheren Schritten, Wissen aus der letzten Stunde, dazu ein Tipp
function htmlAufbau(teil, def) {
  const pz = zustand.pruefung[teil];
  const anker = [];
  (def.stuetzen || []).concat(def.felder).forEach(function (id) {
    if (feldBestaetigt(teil, id) && feldDef(id).merksatz && anker.indexOf(id) < 0) anker.push(id);
  });
  const bekannt = def.bekannt || [];
  let h = '';
  if (anker.length || bekannt.length) {
    h += '<h3 class="aufbau-titel">' + esc(ST.aufbauen) + '</h3><ul class="anker-liste">';
    anker.forEach(function (id) {
      h += '<li><span class="anker-haken" aria-hidden="true">✓</span><span>' + esc(fmt(feldDef(id).merksatz, { wert: feldWertText(id, pz.werte[id]) })) + '</span></li>';
    });
    bekannt.forEach(function (t) {
      h += '<li class="bekannt"><span class="anker-haken" aria-hidden="true">✓</span><span>' + esc(t) + ' <span class="hinweis-leise">(' + esc(ST.bekannt) + ')</span></span></li>';
    });
    h += '</ul>';
  }
  const tipp = hilfeTipp(teil, def);
  if (tipp) h += '<p class="tipp hilfe-tipp"><strong>' + esc(ST.tippLabel) + '</strong> ' + txt(tipp) + '</p>';
  return h;
}
// Tipp, der auf bestätigten Einträgen aufbaut (erste passende Brücke).
// Sonst der Tipp des falschen Feldes, aber nur, wenn ohnehin klar ist, welches es ist.
function hilfeTipp(teil, def) {
  const b = (def.bruecken || []).find(function (br) { return br.wenn.every(function (id) { return feldBestaetigt(teil, id); }); });
  if (b) return b.text;
  const falsch = falscheFelder(teil, def);
  if (falsch.length === 1 && falscheZeigen(teil, def)) return feldDef(falsch[0]).tipp || '';
  return ST.tippBereich;
}
// Denkanstoß: zugeschnitten, wenn beim Öffnen nur ein Feld des Schritts falsch war und klar ist, welches
function denkanstossFuer(def, z) {
  const zu = z.zuschnitt && def.zuschnitt ? def.zuschnitt[z.zuschnitt] : null;
  return { text: (zu && zu.denkanstoss) || def.denkanstoss, bild: (zu && zu.bild !== undefined) ? zu.bild : def.bild, karten: (zu && zu.karten) || def.karten };
}
// Fragen zum Weiterdenken: bei einem einzigen falschen Feld nur die passenden Fragen
function fragenAuswahl(def, z) {
  const zu = z.zuschnitt && def.zuschnitt ? def.zuschnitt[z.zuschnitt] : null;
  const liste = (zu && zu.fragen) ? zu.fragen.slice() : def.fragen.map(function (f, i) { return i; });
  // Die Frage, die schon als Rückfrage gelöst wurde, nicht noch einmal stellen
  const rf = zustand.pruefung[teilVon(def.id)].rf['?' + def.id];
  if (rf && rf.geloest) {
    const ohne = liste.filter(function (i) { return i !== (def.pruefFrage || 0); });
    if (ohne.length) return ohne;
  }
  return liste;
}

// Inhalt einer Antwortmöglichkeit: Text, Baukastenkarte oder Bild
function htmlOptionInhalt(o) {

function htmlHilfeFrage(def, z, i, fz) {

// Stufen der Hilfe: Denkanstoß, Fragen zum Weiterdenken, Vergleich mit dem Teilergebnis
function htmlHilfeStufen(teil, def, z) {
  if (z.stufe === 0) {
    return '<div class="stufe"><button type="button" class="knopf" data-aktion="denkanstoss" data-schritt="' + def.id + '">' + esc(ST.denkanstossKnopf) + '</button></div>';
  }
  const v = denkanstossFuer(def, z);
  let h = '<div class="stufe"><span class="stufe-label">' + esc(ST.stufe1Label) + '</span><div class="denkanstoss' + (v.bild ? ' mit-bild' : '') + '"><p>' + txt(v.text) + '</p>' +
    (v.bild ? htmlBild(v.bild) : '') + '</div>' + htmlKartenChips(v.karten);
  if (def.werkzeug) h += htmlWerkzeug('w-' + def.id, 'rechts');
  h += '</div>';
  if (z.stufe === 1) {
    const bis = z.t1 + zeit('T_STUFE2');
    h += '<div class="stufe">' + (jetzt() < bis ? knopfWarten(ST.stufe2Knopf, z.t1, bis, 'teil', null, 'knopf-zweit') :
      '<button type="button" class="knopf" data-aktion="stufe2" data-schritt="' + def.id + '">' + esc(ST.stufe2Knopf) + '</button>') + '</div>';
  }
  if (z.stufe >= 2) {
    h += '<div class="stufe"><span class="stufe-label">' + esc(ST.stufe2Label) + '</span>';
    z.fragen.forEach(function (fz, i) { h += htmlHilfeFrage(def, z, i, fz); });
    const letzte = z.fragen[z.fragen.length - 1];
    if (letzte && letzte.geloest && z.fragen.length < z.auswahl.length) {
      const bis = letzte.gezeigt + zeit('T_ZWISCHEN_FRAGEN');
      if (jetzt() < bis) h += '<p class="hinweis-leise">' + esc(ST.naechsteFrageWarten) + '</p>' + knopfWarten(ST.naechsteFrage, letzte.gezeigt, bis, 'teil', null, 'knopf-zweit');
      else h += '<button type="button" class="knopf" data-aktion="naechste-frage" data-schritt="' + def.id + '">' + esc(ST.naechsteFrage) + '</button>';
    }
    if (fragenGeloest(def) && z.stufe === 2) h += '<div class="rueckmeldung stimmt">' + esc(ST.alleFragenGeloest) + '</div>';
    h += '</div>';
    if (z.stufe === 2) {
      const bis = z.t2 + zeit('T_STUFE3');
      const frei = stufe3Frei(def, z);
      h += '<div class="stufe"><button type="button" class="knopf" data-aktion="stufe3" data-schritt="' + def.id + '"' + (frei ? '' : ' disabled') + '>' + esc(ST.stufe3Knopf) + '</button>';
      if (!frei) h += '<p class="tor-hinweis">' + esc(ST.stufe3WartenFragen) + '</p>' + htmlCountdown(z.t2, bis, 'teil', ST.stufe3WartenZeit);
      h += '</div>';
    }
  }
  if (z.stufe >= 3) h += htmlVergleich(teil, def);
  return h;
}

// Eintrag korrigieren und erneut prüfen
function htmlKorrektur(teil, def) {

  if (gesperrt) h += htmlCountdown(pz.sperreVon, pz.sperreBis, 'teil', ST.sperreErneut);

/* ----- Vertiefungsfragen: frei, sobald ein Teil ganz geschafft ist -----
   Jede Frage hat Schritte a), b), c). Ein Schritt erscheint erst, wenn der vorige gelöst ist.
   Arten: auswahl (eine Antwort, gilt sofort), windrose (Herkunft des Windes),
   richtigfalsch (Aussagen bewerten), reihenfolge (Satzteile ordnen, dazu Ablenker).
   Antworten und Satzteile erscheinen je Gerät fest gemischt. Ganze Sätze tippt niemand. */
function vFrage(id) {
  let treffer = null;
  ['teil1', 'teil2'].forEach(function (teil) {
    CONTENT[teil].vertiefung.fragen.forEach(function (f) { if (f.id === id) treffer = { teil: teil, frage: f }; });
  });
  return treffer;
}
function vSchrittDef(id, i) { const v = vFrage(id); return v ? v.frage.schritte[i] : null; }
function vZustand(id, i) {
  const v = zustand.vertiefung[id] || (zustand.vertiefung[id] = []);
  if (!v[i]) v[i] = { geloest: false, fehl: 0, sperreVon: 0, sperreBis: 0, letzte: null, versucht: [], wert: null, urteil: {}, geprueft: null, folge: [], fest: 0, stand: null };
  return v[i];
}
// Aussage beim letzten Prüfen: 'ok' (grün), 'falsch' (rot) oder '' (noch nicht geprüft oder seitdem geändert)
function vAussageStatus(s, z, j) {
  const g = z.geprueft ? z.geprueft[j] : undefined;
  if (typeof g !== 'boolean' || z.urteil[j] !== g) return '';
  return g === !!s.aussagen[j].richtig ? 'ok' : 'falsch';
}
function vFehler(z, letzte) {
  z.letzte = letzte;
  z.fehl += 1;
  z.sperreVon = jetzt();
  z.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
}
// Satzteile: Index k gehört an Stelle k, Ablenker haben höhere Indizes. Wie viele stehen von vorn an richtig?
function vRichtigerAnfang(folge) {
  let k = 0;
  while (k < folge.length && folge[k] === k) k++;
  return k;
}
function vTeile(s) { return s.teile.concat(s.ablenker || []); }
function vBereit(s, z) {
  if (s.typ === 'windrose') return !!z.wert;
  if (s.typ === 'richtigfalsch') return s.aussagen.every(function (a, j) { return typeof z.urteil[j] === 'boolean'; });
  if (s.typ === 'reihenfolge') return z.folge.length > 0;
  return true;
}

function htmlVertiefung(teil) {
  const V = CONTENT[teil].vertiefung;
  let h = '<div class="rueckmeldung stimmt geschafft" role="status">' + esc(fmt(ST.teilGeschafft, { nr: teil === 'teil1' ? 1 : 2 })) + '</div>' +
    '<h2 class="vertiefung-titel">' + esc(V.titel) + '</h2>' + (V.einleitung ? '<p class="einleitung">' + esc(V.einleitung) + '</p>' : '');
  V.fragen.forEach(function (f) { h += htmlVertiefungFrage(teil, f); });
  if (V.info) h += '<details class="info karte-box"><summary>' + esc(V.info.titel) + '</summary><p>' + esc(V.info.text) + '</p></details>';
  return h;
}
function htmlVertiefungFrage(teil, f) {
  let h = '<div class="karte-box vertiefung-box" id="block-v-' + f.id + '"><h3>' + esc(f.titel) + '</h3>';
  if (f.einleitung) h += '<p>' + txt(f.einleitung) + '</p>';
  if (f.material) h += '<div class="material"><strong>' + esc(ST.vMaterial) + '</strong> ' + txt(f.material) + '</div>';
  let alle = true;
  for (let i = 0; i < f.schritte.length; i++) {
    const s = f.schritte[i];
    const z = vZustand(f.id, i);
    h += '<div class="v-schritt"><div class="frage-nr">' + esc(fmt(ST.vSchritt, { b: 'abcdefgh'.charAt(i) })) + (z.geloest ? ' · ' + esc(ST.geschafft) : '') + '</div>' +
      '<p class="frage-text">' + txt(s.frage) + '</p>' + (z.geloest ? htmlVGeloest(f.id, i, s, z) : htmlVOffen(f.id, i, s, z)) + '</div>';
    if (!z.geloest) { alle = false; break; }
  }
  if (alle) h += '<p class="v-fertig">' + esc(ST.vFertig) + '</p>';
  return h + '</div>';
}
// Gelöster Schritt: kurz die Lösung und die Rückmeldung
function htmlVGeloest(id, i, s, z) {
  let h = '';
  if (s.typ === 'auswahl') {
    const o = s.optionen.find(function (x) { return x.richtig; });
    h = o.bild ? '<div class="v-loesung-bild">' + bildSvg(o.bild) + '</div>' : '<p class="loesung-kurz">✓ ' + txt(o.text, false) + '</p>';
  } else if (s.typ === 'windrose') {
    h = '<p class="loesung-kurz">✓ ' + esc(CONTENT.richtungen.aus + ' ' + CONTENT.richtungen[z.wert]) + '</p>';
  } else if (s.typ === 'richtigfalsch') {
    // in derselben Reihenfolge wie beim Bewerten, alle grün mit Haken
    h = '<ul class="v-urteile">' + festGemischt(zustand.mischung + '|' + id + '|' + i, s.aussagen.length).map(function (j) {
      const a = s.aussagen[j];
      return '<li><span class="v-urteil-ok">✓ ' + esc(a.richtig ? ST.vStimmt : ST.vStimmtNicht) + '</span> ' + txt(a.text, false) + '</li>';
    }).join('') + '</ul>';
  } else if (s.typ === 'reihenfolge') {
    h = '<p class="loesung-kurz">✓ ' + esc(s.teile.join(' ')) + '</p>';

        '<div class="v-urteil" role="group" aria-label="' + esc(a.text) + '">' + knopf('ja', ST.vStimmt) + knopf('nein', ST.vStimmtNicht) + '</div></div>';

function zeichneStatus() {

    const nr = tab === 'teil1' ? 1 : 2;

/* ----- Fokus beim Neuzeichnen erhalten (Tastaturbedienung) ----- */
let fokusMerker = null;
function merkeFokus() {
  const e = document.activeElement;
  if (!e || e === document.body || !e.dataset) { fokusMerker = null; return; }
  fokusMerker = { id: e.id || '', daten: JSON.stringify(e.dataset) };
}
function stelleFokusHer() {
  if (!fokusMerker) return;
  let e = fokusMerker.id ? document.getElementById(fokusMerker.id) : null;
  if (!e) e = $$('[data-aktion],[data-eingabe]').find(function (x) { return JSON.stringify(x.dataset) === fokusMerker.daten; });
  if (e && !e.disabled) { try { e.focus({ preventScroll: true }); } catch (err) { /* ältere Browser */ } }
  fokusMerker = null;
}
// Neu zeichnen, ohne dass die Seite springt: Safari auf dem iPad hält die Scrollposition nicht von selbst,
// wenn ein Abschnitt ersetzt wird. Deshalb Position (auch in der linken Spalte) merken und wiederherstellen.
function neu(fn) {
  const y = window.pageYOffset;
  const spalte = $('.spalte-schema');
  const ys = spalte ? spalte.scrollTop : 0;
  merkeFokus(); fn(); stelleFokusHer();
  if (Math.abs(window.pageYOffset - y) > 1) window.scrollTo(0, y);
  const spalte2 = $('.spalte-schema');
  if (spalte2 && ys) spalte2.scrollTop = ys;
}
// Inhalt eines Bereichs ersetzen; die alte Höhe bleibt kurz stehen, damit die Seite beim Ersetzen nicht zusammenfällt
function inhaltSetzen(el, html) {
  const hoehe = el.offsetHeight;
  if (hoehe) el.style.minHeight = hoehe + 'px';
  el.innerHTML = html;
  if (hoehe) window.requestAnimationFrame(function () { el.style.minHeight = ''; });
}
function ersetzeBlock(sel, html) {
  const alt = $(sel);
  if (!alt) return false;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  if (tmp.firstElementChild) alt.parentNode.replaceChild(tmp.firstElementChild, alt);
  return true;
}
function blockNeu(block) {
  const tab = zustand.tab;
  neu(function () {
    if (block === 'teil' && (tab === 'teil1' || tab === 'teil2')) zeichneTeil(tab);
    else if (block.indexOf('v-') === 0) {
      // eine Vertiefungsfrage: nur ihren Kasten ersetzen
      const v = vFrage(block.slice(2));
      if (!v || !ersetzeBlock('#block-' + block, htmlVertiefungFrage(v.teil, v.frage))) zeichneBereich();
    }
    else zeichneBereich();
  });
}
// Bereich, in dem ein Feld liegt, neu zeichnen
function gruppeNeu() { blockNeu('teil'); }

/* ----- Takt für alle Countdowns (viermal pro Sekunde) ----- */
function takt() {
  const t = jetzt();
  const fertig = {};
  $$('[data-bis]').forEach(function (el) {
    const bis = +el.dataset.bis, von = +el.dataset.von;
    const rest = bis - t;
    if (rest <= 0) { fertig[el.dataset.block] = true; return; }
    const text = el.querySelector('.countdown-text');
    if (text) text.textContent = fmt(el.dataset.vorlage, { zeit: mmss(rest) });
    const balken = el.querySelector('.countdown-balken > span');
    if (balken && bis > von) balken.style.width = Math.min(100, 100 * (t - von) / (bis - von)).toFixed(1) + '%';
  });
  Object.keys(fertig).forEach(blockNeu);
}

function nachOben(sel) {

function teilNeu() {

    if (titel) {
      titel.scrollIntoView({ block: 'start', behavior: bewegungErlaubt() ? 'smooth' : 'auto' });
      if (titel.hasAttribute('tabindex')) { try { titel.focus({ preventScroll: true }); } catch (e) { /* ältere Browser */ } }
    }
  } else if (ui.zurFrage === zustand.tab) {
    // Nach einer gelösten Rückfrage: die Seite bleibt stehen. Nur wenn der Anfang der nächsten Rückfrage
    // nicht gut zu sehen ist, rückt sie nach oben.
    ui.zurFrage = null;
    const frage = $('#bereich-' + zustand.tab + ' .ablauf-box .frage:not(.frage-geloest)');

const KARTEN_BEDARF = { S1: ['W8'], S2: ['W9'], S3: ['W9'], S4: ['W8', 'W9'], HOEHE: ['W8', 'W9'] };
function kartenNachBedarf() {

/* ----- Schema von Teil 1 oder 2 prüfen ----- */
function schemaPruefen(teil) {
  const pz = zustand.pruefung[teil];
  const P = CONTENT[teil].pruefen;
  const st = ablaufStand(teil);
  if ((st.phase !== 'eintragen' && st.phase !== 'hilfe') || pz.sperreBis > jetzt()) return;
  if (P.felder.some(function (id) { return !pz.werte[id]; })) { ui.hinweis[teil] = P.unvollstaendig; teilNeu(); return; }
  ui.hinweis[teil] = '';
  P.felder.forEach(function (id) {
    const erg = feldBewertung(id, pz.werte[id]);
    pz.ergebnis[id] = erg;
    if (erg !== 'ok') pz.fehl[id] = (pz.fehl[id] || 0) + 1;
  });
  pz.geprueft = Object.assign({}, pz.werte);
  if (!pz.erste) {
    // Erstes Prüfen: Diese Antworten bestimmen den weiteren Weg
    pz.erste = Object.assign({}, pz.ergebnis);
    pz.ersteWerte = Object.assign({}, pz.werte);
    pz.rfListe = rueckfragenZuerst(teil);
  } else if (st.phase === 'hilfe' && !einheitStimmt(teil, st.def)) {
    // Der Schritt mit Hilfe stimmt noch nicht: kurze Sperre, dann neuer Versuch
    pz.sperreVon = jetzt();
    pz.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
    zeigeMeldung(ST.meldungNochNicht);
  } else if (st.phase === 'hilfe') {
    zeigeMeldung(fmt(ST.meldungStimmt, { kurz: st.def.kurz }));
  }
  einheiten(teil).forEach(function (def) { if (einheitStimmt(teil, def)) sz(def.id).erledigt = true; });
  if (alleFelderStimmen(teil)) {
    pz.rf2Liste = rueckfragenZumSchluss(teil);
    bestandenPruefen(teil);
  }
  speichern();
  ui.zumAblauf = teil;
  teilNeu();
  // Nach S4 (alle Felder dort richtig) gibt es die neue Werkzeugkarte W10
  if (teil === 'teil1' && einheitStimmt('teil1', schrittDef('S4'))) karteFreischalten(['W10']);
}

function fokusAuf(sel) {
  const el = $(sel);
  if (el) { try { el.focus({ preventScroll: true }); } catch (e) { /* ältere Browser */ } }
}

/* ----- Kurze Meldung am unteren Rand, zum Beispiel „Bestätigt: Luftbewegung am Pol“ ----- */
let meldungUhr = null;
function zeigeMeldung(text) {
  const el = $('#meldung');
  if (!el) return;
  el.textContent = text;
  el.classList.add('sichtbar');
  window.clearTimeout(meldungUhr);
  meldungUhr = window.setTimeout(function () { el.classList.remove('sichtbar'); }, 3200);
}


// Rückfrage auswerten: richtig = weiter im Ablauf, falsch = erst Hilfe (Tipp) und Sperrzeit,
// nach zwei Fehlern zusätzlich der Denkanstoß des passenden Schritts
function rfAuswerten(teil, key, z, ok, option) {
  if (ok) {
    z.geloest = true;
    z.falsch = false;
    bestandenPruefen(teil);
    // Noch Rückfragen offen: nur zur nächsten Rückfrage, nicht an den Anfang des Blocks.
    // Ist die Runde fertig, geht es wie nach dem Prüfen zum nächsten Abschnitt (Hilfe oder Vertiefung).
    if (ablaufStand(teil).phase === 'rueckfragen') ui.zurFrage = teil;
    else ui.zumAblauf = teil;
    // Neutrale Meldung; erst wenn alle Rückfragen der ersten Runde gelöst sind, werden die bestätigten Einträge grün
    const ersteRunde = zustand.pruefung[teil].rfListe.indexOf(key) >= 0;
    if (ersteRunde && rfRundeFertig(teil) && !alleFelderStimmen(teil)) {
      const k = CONTENT[teil].pruefen.felder.filter(function (id) { return feldBestaetigt(teil, id); }).length;
      zeigeMeldung(fmt(ST.meldungRunde, { k: k }));
    } else zeigeMeldung(ST.meldungRf);
  } else {
    z.falsch = true;
    z.letzte = option;
    z.fehl += 1;
    if (z.fehl === 2) hilfeZaehlen(rfEinheit(teil, key).id);
    z.sperreVon = jetzt();
    z.sperreBis = jetzt() + zeit('T_SPERRE_FEHLER');
  }
  speichern();
  teilNeu();
}

/* ----- Helle oder dunkle Ansicht ----- */
function istDunkel() {
  const e = zustand.einstellungen.dunkel;
  if (e === true || e === false) return e;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function schriftAnwenden() {
  const s = zustand.einstellungen.schrift || 0;
  if (s) document.documentElement.setAttribute('data-schrift', String(s));
  else document.documentElement.removeAttribute('data-schrift');
  $('#schrift-kleiner').disabled = s <= 0;
  $('#schrift-groesser').disabled = s >= 2;
}
function ansichtAnwenden() {
  const e = zustand.einstellungen.dunkel;
  const wurzel = document.documentElement;
  if (e === true) wurzel.setAttribute('data-theme', 'dark');
  else if (e === false) wurzel.setAttribute('data-theme', 'light');
  else wurzel.removeAttribute('data-theme');
  const k = $('#ansicht-schalter');
  if (k) k.setAttribute('aria-checked', String(istDunkel()));
}

function lkNeu(teil) {
  neu(function () {
    if (ui.gross) zeichneGross();
    const box = $('#loesung-' + teil);
    if (box) ersetzeBlock('#loesung-' + teil, htmlLoesung(teil));
  });
}

/* ----- Formulare: Codewort, PIN, Zeiten ----- */
/* ----- Texte bearbeiten (Lehrkraft-Bereich) -----
   Änderungen gelten sofort auf diesem Gerät (gespeichert unter eigenem Namen, bleiben beim Zurücksetzen).
   „Datei herunterladen“ schreibt sie fest in eine neue HTML-Datei, die man an alle iPads verteilt. */
const TEXT_AUSLASSEN = ['id', 'art', 'richtig', 'felder', 'wenn', 'karten', 'bild', 'skizze', 'stuetzen', 'satzbausteine', 'startFeld',
  'nach', 'obenTyp', 'untenTyp', 'kachel', 'typ', 'fast'];
let textListe = null;
function bearbeitbareTexte() {
  if (textListe) return textListe;
  textListe = [];
  (function gehe(o, pfad, schluessel) {
    if (typeof o === 'string') {
      if (TEXT_AUSLASSEN.indexOf(schluessel) >= 0 || !/[A-Za-zÄÖÜäöüß]/.test(o)) return;
      if (/^(W\d{1,2}|S\d)$/.test(o) && schluessel !== 'nr') return;   // Kennungen wie W5 oder S1
      if (/(^|\.)felder\.[^.]+\.(fast|fehlerbilder)(\.|$)/.test(pfad)) return;
      textListe.push(pfad);
      return;
    }
    if (o && typeof o === 'object') Object.keys(o).forEach(function (k) { gehe(o[k], pfad ? pfad + '.' + k : k, Array.isArray(o) ? schluessel : k); });
  })(ORIGINAL, '', '');
  return textListe;
}
function textJetzt(p) { return Object.prototype.hasOwnProperty.call(textAenderungen, p) ? textAenderungen[p] : wertAnPfad(ORIGINAL, p); }
// Lesbarer Ort eines Textes, zum Beispiel "Teil 1 › schritte › S2 › denkanstoss"
function pfadLabel(p) {
  const L = CONTENT.lehrkraft;
  let o = ORIGINAL;
  return p.split('.').map(function (k, i) {
    const wert = o ? o[k] : undefined;
    let teil = k;
    if (i === 0) teil = L.texteBereiche[k] || k;
    else if (Array.isArray(o)) teil = (wert && typeof wert === 'object' && (wert.nr || wert.id)) ? (wert.nr || wert.id) : String(+k + 1);
    o = wert;
    return teil;
  }).join(' › ');
}
function texteSpeichern() {
  try { window.localStorage.setItem(TEXTE_SCHLUESSEL, JSON.stringify(textAenderungen)); } catch (e) { /* ohne Speicher nur bis zum Neuladen */ }
}
function htmlTextEditor() {
  const L = CONTENT.lehrkraft;
  const n = Object.keys(textAenderungen).length;
  let h = '<div class="karte-box text-editor" id="block-texte"><h2>' + esc(L.texteTitel) + '</h2><p class="einleitung">' + esc(L.texteEinleitung) + '</p>';
  h += '<div class="such-zeile"><input type="search" class="eingabe text-suche" id="text-suche" data-eingabe="text-suche" autocomplete="off" placeholder="' + esc(L.texteSuche) + '" aria-label="' + esc(L.texteSuche) + '" value="' + esc(ui.textSuche) + '">' +
    '<select class="eingabe" data-eingabe="text-bereich" aria-label="' + esc(L.texteBereich) + '"><option value="alle">' + esc(L.texteAlle) + '</option>' +
    Object.keys(L.texteBereiche).filter(function (k) { return k in ORIGINAL; }).map(function (k) {
      return '<option value="' + k + '"' + (ui.textBereich === k ? ' selected' : '') + '>' + esc(L.texteBereiche[k]) + '</option>';
    }).join('') + '</select></div>';
  h += '<div id="text-treffer">' + htmlTextTreffer() + '</div>';
  h += '<p class="text-stand" id="text-stand">' + esc(fmt(L.texteGeaendert, { n: n })) + '</p>';
  h += '<div class="knopf-reihe"><button type="button" class="knopf knopf-primaer" data-aktion="text-export">' + esc(L.texteHerunterladen) + '</button>';
  if (n && !ui.textVerwerfenFrage) h += '<button type="button" class="knopf" data-aktion="text-verwerfen">' + esc(L.texteVerwerfen) + '</button>';
  h += '</div>';
  if (ui.textVerwerfenFrage) {
    h += '<div class="bestaetigung" style="margin-top:12px"><p>' + esc(L.texteVerwerfenFrage) + '</p><div class="knopf-reihe">' +
      '<button type="button" class="knopf knopf-warnung" data-aktion="text-verwerfen-ja">' + esc(L.texteVerwerfenJa) + '</button>' +
      '<button type="button" class="knopf" data-aktion="text-verwerfen-nein">' + esc(L.resetNein) + '</button></div></div>';
  }
  return h + '<p class="hinweis-leise">' + esc(L.texteHinweis) + '</p></div>';
}
function htmlTextTreffer() {
  const L = CONTENT.lehrkraft;
  const q = ui.textSuche.trim().toLowerCase();
  if (!q && ui.textBereich === 'alle') return '<p class="hinweis-leise">' + esc(L.texteSuchen) + '</p>';
  const treffer = bearbeitbareTexte().filter(function (p) {
    if (ui.textBereich !== 'alle' && p.split('.')[0] !== ui.textBereich) return false;
    // auch im Originaltext suchen, damit ein Eintrag beim Tippen nicht aus der Liste verschwindet
    return !q || (pfadLabel(p) + ' ' + textJetzt(p) + ' ' + wertAnPfad(ORIGINAL, p)).toLowerCase().indexOf(q) >= 0;
  });
  const zeigen = treffer.slice(0, 40);
  let h = '<p class="hinweis-leise" role="status">' + esc(treffer.length > zeigen.length ? fmt(L.texteTrefferViele, { z: zeigen.length, n: treffer.length }) : fmt(L.texteTreffer, { n: treffer.length })) + '</p>';
  zeigen.forEach(function (p) {
    const wert = textJetzt(p);
    const an = Object.prototype.hasOwnProperty.call(textAenderungen, p);
    h += '<div class="text-eintrag' + (an ? ' geaendert' : '') + '"><div class="text-pfad">' + esc(pfadLabel(p)) + (an ? ' <span class="text-marke">' + esc(L.texteGeaendertMarke) + '</span>' : '') + '</div>' +
      '<textarea class="freitext text-feld" data-eingabe="text-wert" data-pfad="' + esc(p) + '" rows="' + Math.min(8, Math.ceil(wert.length / 60) + 1) + '" aria-label="' + esc(pfadLabel(p)) + '">' + esc(wert) + '</textarea>' +
      (an ? '<div class="knopf-reihe" style="margin-top:6px"><button type="button" class="knopf knopf-klein" data-aktion="text-original" data-pfad="' + esc(p) + '">' + esc(L.texteOriginal) + '</button></div>' : '') + '</div>';
  });
  return h;
}
function textTrefferNeu(fokusPfad, pos) {
  const box = $('#text-treffer');
  if (!box) return;
  box.innerHTML = htmlTextTreffer();
  const st = $('#text-stand');
  if (st) st.textContent = fmt(CONTENT.lehrkraft.texteGeaendert, { n: Object.keys(textAenderungen).length });
  if (fokusPfad) {
    const feld = $$('#text-treffer textarea').find(function (t) { return t.dataset.pfad === fokusPfad; });
    if (feld) { feld.focus({ preventScroll: true }); if (pos !== undefined) feld.setSelectionRange(pos, pos); }
  }
}
// Einen Text ändern (leer gelassen oder wie im Original: Änderung entfernen)
function textAendern(p, wert) {
  if (wert === wertAnPfad(ORIGINAL, p)) delete textAenderungen[p]; else textAenderungen[p] = wert;
  wertSetzen(CONTENT, p, typografie(textJetzt(p)));
  texteSpeichern();
}
// Neue Datei: geänderte Texte direkt im Quelltext ersetzen; was dort nicht eindeutig steht, kommt in einen Block am Ende von CONTENT
function jsText(s) {
  return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n').replace(/<\/(script)/gi, '<\\/$1') + "'";
}
function dateiMitAenderungen() {
  const start = QUELLTEXT.indexOf('const CONTENT = {');
  const ende = QUELLTEXT.indexOf('<\/script>', start);   // "<\/": sonst endet hier das Skript
  let inhalt = QUELLTEXT.slice(start, ende);
  const rest = {};
  Object.keys(textAenderungen).forEach(function (p) {
    const alt = jsText(wertAnPfad(ORIGINAL, p));
    if (inhalt.split(alt).length === 2) inhalt = inhalt.replace(alt, function () { return jsText(textAenderungen[p]); });
    else rest[p] = textAenderungen[p];
  });
  if (Object.keys(rest).length) {
    inhalt += '\n/* Geänderte Texte aus dem Lehrkraft-Bereich, die oben nicht eindeutig zu finden waren */\n' +
      'window.TEXT_AENDERUNGEN = Object.assign(window.TEXT_AENDERUNGEN || {}, {\n' +
      Object.keys(rest).map(function (p) { return '  ' + jsText(p) + ': ' + jsText(rest[p]); }).join(',\n') + '\n});\n';
  }
  return QUELLTEXT.slice(0, start) + inhalt + QUELLTEXT.slice(ende);
}
function textDateiHerunterladen() {
  const blob = new Blob([dateiMitAenderungen()], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = CONTENT.lehrkraft.texteDateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
}
Object.assign(AKTIONEN, {
  'text-export': function () { textDateiHerunterladen(); zeigeMeldung(CONTENT.lehrkraft.texteExportiert); },
  'text-verwerfen': function () { ui.textVerwerfenFrage = true; neu(zeichneLehrkraft); },
  'text-verwerfen-nein': function () { ui.textVerwerfenFrage = false; neu(zeichneLehrkraft); },
  'text-verwerfen-ja': function () {
    Object.keys(textAenderungen).forEach(function (p) { wertSetzen(CONTENT, p, typografie(wertAnPfad(ORIGINAL, p))); });
    textAenderungen = {};
    texteSpeichern();
    ui.textVerwerfenFrage = false;
    neu(zeichneLehrkraft);
    zeigeMeldung(CONTENT.lehrkraft.texteVerworfen);
  },
  'text-original': function (d) { textAendern(d.pfad, wertAnPfad(ORIGINAL, d.pfad)); textTrefferNeu(); }
});

const FORMULARE = {
  'codewort': function (form) {
    const wert = String(form.elements.codewort.value || '');
    const norm = function (s) { return String(s).trim().toUpperCase().replace(/\s+/g, ''); };
    if (norm(wert) === norm(CONFIG.CODEWORT)) {
      ui.codewortFehler = false;
      teil2Freischalten();
      allesZeichnen();
    } else {
      ui.codewortFehler = true;
      allesZeichnen();
      const e = $('#codewort-eingabe');
      if (e) { e.value = wert; e.focus(); }
    }
  },
  'pin': function (form) {
    if (String(form.elements.pin.value || '').trim() === String(CONFIG.PIN)) {
      ui.lehrkraftOffen = true; ui.pinFehler = false;
    } else {
      ui.pinFehler = true;
    }
    zeichneLehrkraft();
    const e = $('#pin-eingabe');
    if (e) e.focus();
  },
  'zeiten': function (form) {
    const neueZeiten = {};
    ['T_STUFE2', 'T_ZWISCHEN_FRAGEN', 'T_SPERRE_FEHLER', 'T_STUFE3'].forEach(function (k) {
      const v = parseFloat(String(form.elements[k].value).replace(',', '.'));
      if (!isNaN(v) && v >= 0) neueZeiten[k] = Math.min(900, v);
    });
    zustand.einstellungen.zeiten = neueZeiten;
    speichern();
    ui.meldung = 'zeiten';
    neu(zeichneLehrkraft);
  }
};

/* ----- Eingaben: Freitexte, Häkchen, Auswahllisten ----- */
const EINGABEN = {
  'text-suche': function (el) { ui.textSuche = el.value; textTrefferNeu(); },
  'text-bereich': function (el) { ui.textBereich = el.value; textTrefferNeu(); },
  'text-wert': function (el) {
    const p = el.dataset.pfad;
    const vorher = Object.prototype.hasOwnProperty.call(textAenderungen, p);
    textAendern(p, el.value);
    // Markierung „geändert“ erneuern, ohne die Eingabe zu stören
    if (vorher !== Object.prototype.hasOwnProperty.call(textAenderungen, p)) textTrefferNeu(p, el.selectionStart);
    else { const st = $('#text-stand'); if (st) st.textContent = fmt(CONTENT.lehrkraft.texteGeaendert, { n: Object.keys(textAenderungen).length }); }
  },
  'zeitdruck': function (el) {
    zustand.einstellungen.zeitdruck = el.checked;
    speichern();
  }
};

/* ----- Ereignisse verbinden ----- */
document.addEventListener('click', function (ev) {
  if (ev.target === $('#modal')) { schliesseModal(); return; }
  const ziel = ev.target.closest('[data-aktion]');
  if (!ziel || ziel.disabled) return;
  const fn = AKTIONEN[ziel.dataset.aktion];
  if (fn) { ev.preventDefault(); fn(ziel.dataset, ziel); }
});
document.addEventListener('submit', function (ev) {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fn = FORMULARE[form.dataset.form];
  if (fn) fn(form);
});
document.addEventListener('input', function (ev) {
  const el = ev.target;
  if ((el.tagName === 'TEXTAREA' || el.type === 'search') && el.dataset.eingabe && EINGABEN[el.dataset.eingabe]) EINGABEN[el.dataset.eingabe](el);
});
document.addEventListener('change', function (ev) {
  const el = ev.target;
  if (el.tagName !== 'TEXTAREA' && el.type !== 'search' && el.dataset && el.dataset.eingabe && EINGABEN[el.dataset.eingabe]) EINGABEN[el.dataset.eingabe](el);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (!$('#modal').hidden) schliesseModal();
  else if (!$('#karten-overlay').hidden) AKTIONEN['karten-zu']();
  else if (baukastenOffen()) schliesseBaukasten();
  else if (ui.skizzeGross) AKTIONEN['skizze-gross-zu']();
  else if (ui.gross) AKTIONEN['lk-gross-zu']();
});

/* ----- Start ----- */
function start() {
  document.documentElement.lang = 'de';
  $('#titel').textContent = A.titel;
  $('#untertitel').textContent = A.untertitel;
  $('#baukasten-text').textContent = A.baukastenKnopf;
  $('#baukasten-text-kurz').textContent = A.baukastenKurz;
  $('#baukasten-knopf').setAttribute('aria-label', A.baukastenKnopf);
  $('#baukasten-zu').textContent = A.schliessen;
  // Leiste unten: kurze Namen, vorgelesen wird der ganze Name
  $('#tabs').setAttribute('aria-label', A.bereicheLabel);
  ['teil1', 'teil2'].forEach(function (t) { $('#tab-text-' + t).textContent = A.tabsKurz[t]; $('#tab-' + t).setAttribute('aria-label', A.tabs[t]); });
  $('#tab-lehrkraft').setAttribute('aria-label', A.tabs.lehrkraft);
  // Schriftgröße
  $('#schrift-kleiner').setAttribute('aria-label', A.schriftKleiner);
  $('#schrift-kleiner').setAttribute('title', A.schriftKleiner);
  $('#schrift-groesser').setAttribute('aria-label', A.schriftGroesser);
  $('#schrift-groesser').setAttribute('title', A.schriftGroesser);
  schriftAnwenden();
  $('#tab-lehrkraft').setAttribute('title', A.tabs.lehrkraft);
  if (!speicherOk) { const h = $('#speicher-hinweis'); h.textContent = A.ohneSpeicher; h.hidden = false; }
  // Schalter für die dunkle Ansicht
  $('#ansicht-text').textContent = A.dunkel;
  $('#ansicht-schalter').setAttribute('aria-label', A.dunkelLang);
  ansichtAnwenden();
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const folgen = function () { if (zustand.einstellungen.dunkel !== true && zustand.einstellungen.dunkel !== false) ansichtAnwenden(); };
    if (mq.addEventListener) mq.addEventListener('change', folgen); else if (mq.addListener) mq.addListener(folgen);
  }
  // Knopf „Neu starten“ (in CONFIG abschaltbar)
  const ns = $('#neustart-knopf');
  if (CONFIG.NEUSTART_KNOPF) {
    $('#neustart-text').textContent = A.neustartKnopf;
    ns.setAttribute('aria-label', A.neustartKnopf);
    ns.hidden = false;
  } else ns.remove();
  // Lehrkraft-Bereich nie von selbst öffnen; das frühere Quiz gibt es nicht mehr
  if (zustand.tab === 'lehrkraft' || zustand.tab === 'quiz') zustand.tab = 'teil1';
  allesZeichnen();
  window.setInterval(takt, 250);
}
start();
})();
